<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>死亡シミュレーター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2a2a;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#1a1a1a;
  user-select:none;-webkit-user-select:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
.nb{display:inline-block;white-space:nowrap}

/* 絵は画面いっぱい。遊ぶ場所は縦9:16で中央 */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠。単位は cqw（枠の幅の1%）。文字の置き場所に使う */
#stage{position:relative;container-type:size;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}
.hz{background:repeating-linear-gradient(-45deg,#ffcc00 0 3cqw,#1a1a1a 3cqw 6cqw)}

#stripeT,#stripeB{position:absolute;left:0;right:0;height:3cqw}
#stripeT{top:0}#stripeB{bottom:0}
#hdr{position:absolute;top:5.5cqw;left:5cqw;right:5cqw;height:11cqw;background:#1a1a1a;color:#ffcc00;
  border-radius:1.8cqw;display:flex;align-items:center;justify-content:space-between;padding:0 4cqw}
#dayNo{font-size:7.4cqw;font-weight:bold;letter-spacing:.3cqw}
#best{font-size:3.6cqw;opacity:.9}
#msg{position:absolute;top:128cqw;left:6cqw;right:6cqw;height:11cqw;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:4.6cqw;font-weight:bold}
#msg.dead{color:#fff;background:#1a1a1a;border-radius:1.6cqw;padding:0 3cqw}

.btn{border:0;font:inherit;font-weight:bold;cursor:pointer;touch-action:manipulation;pointer-events:auto}
/* 「死ぬ」ボタン（押す＝死に方がひとつ決まって、その場面がすぐ流れる） */
#goDie{position:absolute;top:146cqw;left:12cqw;right:12cqw;height:19cqw;font-size:9cqw;letter-spacing:2cqw;padding-left:2cqw;
  background:#ffcc00;color:#1a1a1a;border:1.1cqw solid #1a1a1a;border-radius:3.6cqw;box-shadow:0 1.6cqw 0 #1a1a1a;animation:blink 1.6s ease-in-out infinite}
#goDie:active{transform:translateY(1.1cqw);box-shadow:0 .5cqw 0 #1a1a1a;animation:none}
#goDie.hide{visibility:hidden}

/* 死亡演出：全画面の映像（動画の上のキャンバスにピクトグラム。寄り・揺れは #cineInner をまとめて動かす） */
#cine{position:absolute;inset:0;z-index:20;overflow:hidden;background:#000;display:none;pointer-events:auto}
#cine.show{display:block;animation:cfade .3s both}
#cine.out{animation:cout .4s both}
@keyframes cfade{from{opacity:0}to{opacity:1}}
@keyframes cout{from{opacity:1}to{opacity:0}}
#cineInner{position:absolute;inset:0;transform-origin:50% 78%;will-change:transform}
#cv2{position:absolute;inset:0;width:100%;height:100%}
#cineFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* 死因カード：注意標識 */
#result{position:absolute;left:7cqw;right:7cqw;top:50cqw;z-index:30;
  background:#ffcc00;border:1.4cqw solid #1a1a1a;border-radius:3cqw;overflow:hidden;
  box-shadow:0 2cqw 0 #1a1a1a;text-align:center;pointer-events:auto;
  display:none;flex-direction:column;align-items:center;gap:2cqw;padding:0 5cqw 4cqw}
#result.show{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#result .sign{align-self:stretch;margin:0 -5cqw;background:#1a1a1a;color:#ffcc00;font-size:7cqw;font-weight:bold;letter-spacing:2cqw;padding:2cqw 0 2cqw 2cqw}
#rCause{font-size:6.4cqw;font-weight:bold;margin-top:1.6cqw;line-height:1.35}
#rDays{font-size:4.6cqw;font-weight:bold}
#rStat{align-self:stretch;background:#1a1a1a;color:#ffcc00;border-radius:2cqw;padding:2cqw 3cqw;display:flex;flex-direction:column;gap:.8cqw}
#rStat b{font-size:6.6cqw}
#rStat span{font-size:3.1cqw;color:#fff;opacity:.9;line-height:1.4}
#rPrev{font-size:3.7cqw;font-weight:bold;line-height:1.5}
#rPrev i{font-style:normal;background:#1a1a1a;color:#ffcc00;border-radius:1cqw;padding:.3cqw 1.4cqw;margin-right:1.2cqw;font-size:3.2cqw}
#rBest{font-size:3.4cqw;min-height:4cqw}
#rGame{font-size:2.6cqw;opacity:.75}
#rRow{display:flex;gap:2.5cqw;align-self:stretch;margin-top:.5cqw}
#retry{flex:1;height:12.5cqw;font-size:5.4cqw;background:#1a1a1a;color:#ffcc00;border-radius:3cqw}
#retry:active{transform:translateY(.8cqw)}
#dexOpen2{width:19cqw;height:12.5cqw;font-size:4.4cqw;background:#fff3b0;color:#1a1a1a;border:.9cqw solid #1a1a1a;border-radius:3cqw}
#shareBtn{width:13cqw;height:12.5cqw;font-size:6cqw;background:#fff;color:#1a1a1a;border:.9cqw solid #1a1a1a;border-radius:3cqw}

/* タイトル：注意看板 */
#title{position:absolute;inset:0;z-index:80;background:#fbf8ee;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
  gap:3.2cqw;padding:12cqw 8cqw;text-align:center;pointer-events:auto;cursor:pointer;animation:cfade .3s both}
#title.out{animation:cout .45s both}
#titleSign{position:relative;width:62cqw;height:62cqw;flex:none}
#titleSign::before{content:'';position:absolute;inset:9%;background:#ffcc00;border:1.6cqw solid #1a1a1a;border-radius:4cqw;transform:rotate(45deg);box-shadow:0 1.4cqw 0 #1a1a1a}
#titleFig{position:absolute;left:25%;top:22%;width:50%;height:56%}
#titleName{font-size:10.4cqw;font-weight:bold;line-height:1.2;letter-spacing:.4cqw}
#titleSub{font-size:5.2cqw;font-weight:bold}
#titleGo{margin-top:3cqw;background:#ffcc00;color:#1a1a1a;border:1cqw solid #1a1a1a;border-radius:3.2cqw;box-shadow:0 1.4cqw 0 #1a1a1a;
  font-size:7cqw;font-weight:bold;letter-spacing:.8cqw;padding:3.2cqw 12cqw 3.2cqw 13cqw;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.05)}}
#titleNote{font-size:3.2cqw;opacity:.75;line-height:1.6}
#rOdds{font-size:3.7cqw;font-weight:bold;line-height:1.5}
#rOdds.new{color:#1a1a1a;background:#fff;border-radius:1.6cqw;padding:1.2cqw 2.4cqw;border:.6cqw solid #1a1a1a}
#rNew{position:absolute;top:1.4cqw;right:3cqw;display:none;transform:rotate(10deg);border:.8cqw solid #d9291c;color:#d9291c;
  font-size:5cqw;font-weight:bold;padding:.2cqw 2cqw;border-radius:1.4cqw;background:#fffbe0;letter-spacing:.3cqw;animation:stamp .35s cubic-bezier(.3,1.8,.5,1) both}
@keyframes stamp{from{transform:rotate(12deg) scale(2.4);opacity:0}to{transform:rotate(12deg) scale(1);opacity:1}}
#rBanner{display:none;align-self:stretch;background:#d9291c;color:#fff;font-size:4.6cqw;font-weight:bold;padding:1cqw 0;margin:0 -5cqw;letter-spacing:.3cqw;white-space:nowrap}

/* 図鑑：注意標識のカードが並ぶ */
#hdr{gap:2cqw}
#best{flex:1;text-align:right}
#dexBtn{height:7.4cqw;padding:0 2.6cqw;font-size:3.4cqw;background:#ffcc00;color:#1a1a1a;border-radius:2cqw;white-space:nowrap}
#dex{position:absolute;inset:0;z-index:50;background:#fbf8ee;display:none;flex-direction:column;pointer-events:auto}
#dex.show{display:flex;animation:cfade .2s both}
#dexHead{display:flex;align-items:center;justify-content:space-between;margin:5.5cqw 5cqw 2cqw;padding:0 4cqw;height:11cqw;background:#1a1a1a;color:#ffcc00;border-radius:1.8cqw;font-weight:bold}
#dexHead b{font-size:6.4cqw}
#dexClose{height:7.4cqw;padding:0 3cqw;font-size:3.8cqw;background:#ffcc00;color:#1a1a1a;border-radius:2cqw}
#dexGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw 2cqw;padding:2cqw 5cqw;align-content:start;touch-action:pan-y}
.dcard{display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation}
.dsign{position:relative;width:78%;aspect-ratio:1}
.dsign::before{content:'';position:absolute;inset:10%;background:#ffcc00;border:.9cqw solid #1a1a1a;border-radius:2.2cqw;transform:rotate(45deg)}
.dsign canvas{position:absolute;left:25%;top:25%;width:50%;height:50%}
.dcard.empty .dsign::before{background:#d8d4c4;border-color:#8a8678}
.dcard.empty .dsign canvas{display:none}
.dcard.empty .dsign::after{content:'？';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9cqw;font-weight:bold;color:#8a8678}
.dname{font-size:2.9cqw;font-weight:bold;text-align:center;line-height:1.3;margin-top:-1cqw;min-height:7.6cqw}
.dstars{font-size:2.8cqw;color:#b98a00;letter-spacing:-.1cqw;margin-top:.2cqw}
#dexFoot{font-size:2.8cqw;text-align:center;opacity:.75;padding:1.5cqw 4cqw 4.5cqw}
#dexDetail{position:absolute;inset:0;z-index:55;background:#000a;display:none;align-items:center;justify-content:center;pointer-events:auto}
#dexDetail.show{display:flex}
#ddBox{width:86%;background:#ffcc00;border:1.4cqw solid #1a1a1a;border-radius:3cqw;padding:4cqw;display:flex;flex-direction:column;align-items:center;gap:2cqw;text-align:center;box-shadow:0 2cqw 0 #1a1a1a}
#ddIcon{width:24cqw;height:24cqw;background:#fff3b0;border:.9cqw solid #1a1a1a;border-radius:3cqw}
#ddName{font-size:6cqw;font-weight:bold;line-height:1.35}
#ddMeta{font-size:3.6cqw;font-weight:bold}
#ddClose{width:100%;height:11cqw;font-size:4.8cqw;background:#1a1a1a;color:#ffcc00;border-radius:3cqw;margin-top:1cqw}
#cv3{position:absolute;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="stripeT" class="hz"></div>
  <div id="hdr"><span id="dayNo">死亡 0回</span><span id="best"></span><button id="dexBtn" class="btn">図鑑 0/13</button></div>
  <div id="msg"></div>
  <button id="goDie" class="btn">死ぬ</button>
  <div id="cine">
    <div id="cineInner"><canvas id="cv2"></canvas></div>
    <div id="cineFlash"></div>
  </div>
  <div id="result">
    <div class="sign">死亡</div>
    <div id="rBanner"></div>
    <div id="rNew">NEW!</div>
    <div id="rCause"></div>
    <div id="rDays"></div>
    <div id="rOdds"></div>
    <div id="rStat"><b id="rStatN"></b><span id="rStatNote"></span></div>
    <div id="rPrev"></div>
    <div id="rBest"></div>
    <div id="rRow"><button id="retry" class="btn">もう一度</button><button id="dexOpen2" class="btn">図鑑</button><button id="shareBtn" class="btn" aria-label="Xで共有">X</button></div>
    <div id="rGame">※ ゲームでは 死ぬ頻度を 大げさに しています</div>
  </div>
  <div id="dex">
    <div id="dexHead"><b id="dexTitle">図鑑</b><button id="dexClose" class="btn">とじる</button></div>
    <div id="dexGrid"></div>
    <div id="dexFoot">※ ゲームでは 死ぬ頻度を 大げさに しています</div>
  </div>
  <div id="dexDetail"><div id="ddBox">
    <canvas id="ddIcon" width="160" height="160"></canvas>
    <div id="ddName"></div><div id="ddMeta"></div>
    <div style="align-self:stretch;background:#1a1a1a;color:#ffcc00;border-radius:2cqw;padding:2cqw 3cqw;display:flex;flex-direction:column;gap:.8cqw"><b id="ddStat" style="font-size:6.2cqw"></b><span id="ddNote" style="font-size:3.1cqw;color:#fff;line-height:1.4"></span></div>
    <div id="ddPrev" style="font-size:3.5cqw;font-weight:bold;line-height:1.5"></div>
    <button id="ddClose" class="btn">とじる</button>
  </div></div>
  <canvas id="cv3"></canvas>
  <div id="title">
    <div id="titleSign"><canvas id="titleFig" width="300" height="340"></canvas></div>
    <div id="titleName"><span class="nb">死亡</span><span class="nb">シミュレーター</span></div>
    <div id="titleSub"><span class="nb">あなたは</span> <span class="nb">今日、</span><span class="nb">何で</span> <span class="nb">死ぬ？</span></div>
    <div id="titleGo">はじめる</div>
    <div id="titleNote"><span class="nb">日本の本当の統計をもとにした</span> <span class="nb">ゲームです。</span><br><span class="nb">死ぬ頻度は</span> <span class="nb">大げさに</span> <span class="nb">してあります</span></div>
  </div>
  <div id="stripeB" class="hz"></div>
</div>
<script>
// ===== 調整用の数値（ここだけ触れば遊びが変わる）=====
// 世界の大きさは 幅100 × 高さ177.8（縦9:16）。長さの単位はすべてこの世界の単位
const CFG = {
  worldW: 100,
  worldH: 100 * 16 / 9,
  shareUrl: 'https://fish-suika.github.io/death-simulator/',

  // 図鑑のおまけ：まだ載っていない死に方が出やすくなる（図鑑の最後が埋まらないのを防ぐ。目安：通しで 20〜25 回で 12 種そろう）
  boostFrom: 3,         // 図鑑に載っている数がこれを超えたら太くなり始める
  boostMax: 5,          // 12 種のうち最後の 1 つが載っていないとき、重みが 1+この値 倍
  minWeight: 0.9,       // 重みの下限（まれな死に方も細くなりすぎないように）
};

// 死に方（実データ。出典と計算は docs/データ出典.md）。
// n：年間の死者数（円盤のマス幅の元。weight = 1 + log10(n) で縮める）。stat/note：死因カードに出す数字と出どころ。prevent：防ぐには。
// dest：出る行き先（any は どの行き先でも出る）。cine：全画面の場面（無い物は簡易演出）
const DEATHS = [
  { id: 'mochi', dest: 'home', name: 'もちを のどに つまらせる', n: 330,
    stat: '年間 約330人', note: '65歳以上・2018〜2019年の平均（消費者庁）',
    prevent: 'もちは 小さく切って、よくかんでから 飲みこむ',
    near: 'もちが のどの おくを かすめた',
    cine: { scene: 'mochi', impactT: 3.2, flash: '#000000', feet: [50, 152], scale: 1.25, sound: 'room' } },
  { id: 'yuki', dest: 'home', name: '雪下ろしで 屋根から 落ちる', n: 80,
    stat: '年間 約80人', note: '雪害の死者・2010〜2019年冬の平均。大半が除雪中（消防庁）',
    prevent: '雪下ろしは ひとりでやらず、命綱と ヘルメットを つける',
    near: '屋根の雪が ずるっと 動いた',
    cine: { scene: 'yuki', impactT: 3, flash: '#ffffff', feet: [50, 152], scale: 1.3, sound: 'rumble' } },
  { id: 'fugu', dest: 'home', name: 'フグの毒に あたる', n: 1.5,
    stat: '10年で 約15人', note: '2003〜2012年（神奈川県衛生研究所の集計）',
    prevent: 'フグは 免許のある店で。釣ったフグを 家でさばかない',
    near: 'フグの 肝が ちらっと 見えた',
    cine: { scene: 'fugu', impactT: 3, flash: '#000000', feet: [50, 152], scale: 1.25, sound: 'room' } },
  { id: 'kinoko', dest: 'home', name: '毒キノコを 食べる', n: 0.3,
    stat: '10年で 3人', note: '2012〜2021年（厚生労働省）',
    prevent: '知らない キノコは 食べない・人にも あげない。迷ったら 捨てる',
    near: 'あやしい キノコと めが あった',
    cine: { scene: 'kinoko', impactT: 3.2, flash: '#000000', feet: [50, 152], scale: 1.25, sound: 'room' } },
  { id: 'furo', dest: 'home', name: 'お風呂で おぼれる', n: 5000,
    stat: '年間 約5,000人', note: '家庭の浴槽・2015〜2019年（人口動態統計）。交通事故より多い',
    prevent: 'お湯は 41度以下・10分まで。入る前に 脱衣所と 浴室を あたためる。家族に ひと声かける',
    near: 'お湯が ちょっと 熱かった',
    cine: { scene: 'furo', impactT: 3.2, flash: '#000000', feet: [50, 150], scale: 1.25, sound: 'room' } },
  { id: 'hachi', dest: 'mountain', name: 'ハチに さされる', n: 18,
    stat: '年間 約18人', note: '2021〜2024年の平均（人口動態統計）',
    prevent: '黒い服を 避け、巣を見つけたら そっと はなれる。さされたら すぐ病院へ',
    near: 'ハチが みみもとを とおりすぎた',
    cine: { scene: 'hachi', impactT: 3.2, flash: '#000000', feet: [50, 150], scale: 1.3, sound: 'buzz' } },
  { id: 'hebi', dest: 'mountain', name: '毒ヘビに かまれる', n: 3.5,
    stat: '年間 約3〜4人', note: '2018〜2019年（人口動態統計）',
    prevent: '草むらに 手や足を つっこまない。かまれたら 動かず 救急車を',
    near: '足もとの 落ち葉が がさっと 動いた',
    cine: { scene: 'hebi', impactT: 3, flash: '#000000', feet: [30, 152], scale: 1.3, sound: 'room' } },
  { id: 'nadare', dest: 'mountain', name: '雪崩に のまれる', n: 9,
    stat: '年間 約9人', note: '1991〜2020年の30年で274人（日本雪崩ネットワーク）',
    prevent: '雪崩の危険が高い日は 斜面に入らない。入るなら 装備と講習を',
    near: '山の上で 雪けむりが 上がった',
    cine: { scene: 'nadare', impactT: 3.2, flash: '#ffffff', feet: [50, 150], scale: 1.3, sound: 'rumble' } },
  { id: 'sangaku', dest: 'mountain', name: '山で 遭難する', n: 300,
    stat: '年間 約300人', note: '死者・行方不明者・2024年（警察庁）。原因は道迷い・転倒・滑落など',
    prevent: '登山計画書を出し、ヘッドライトと 防寒着を持つ。道に迷ったら 沢には おりない',
    near: '道が 二つに 分かれていた',
    cine: { scene: 'sangaku', impactT: 3.4, flash: '#000000', feet: [50, 152], scale: 1.3, sound: 'wind' } },
  { id: 'tsuri', dest: 'sea', name: '釣りで 海に 落ちる', n: 90,
    stat: '年間 約90人', note: '釣り中の海中転落・2004〜2013年の平均（海上保安庁）',
    prevent: 'ライフジャケットを着る。ひとりで行かず、荒れた日の 岩場や防波堤には 行かない',
    near: '足もとの 岩が ぬるっと した',
    cine: { scene: 'tsuri', impactT: 3.2, flash: '#000000', feet: [38, 152], scale: 1.3, sound: 'water' } },
  { id: 'umi', dest: 'sea', name: '海で おぼれる', n: 372,
    stat: '年間 約370人', note: '海の死者・行方不明者・2024年（警察庁）',
    prevent: '流されたら 岸と平行に およぐ。ライフジャケットを着て、監視員のいる浜で',
    near: 'あしが ふっと うきそうになった',
    cine: { scene: 'umi', impactT: 3.2, flash: '#000000', feet: [50, 150], scale: 1.3, sound: 'water' } },
  { id: 'rakurai', dest: 'any', name: '落雷に うたれる', n: 10,
    stat: '年間 10人未満', note: '近年の日本（藤部 2017）',
    prevent: '空が 暗くなったら 建物か 車の中へ。木の下には にげない',
    near: 'とおくで ゴロゴロと なった',

// ルーレットと行き先選びはやめた（テストプレイで「毎回選ぶのが面倒」と言われたため）。
// タップすると、実データの比にそった重みで死に方がひとつ決まり、すぐその場面が流れる
const TAU = Math.PI * 2;
const mod = (a, m) => ((a % m) + m) % m;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 図鑑まわり（画面側 65-dex.js が差し替える）。隠し枠（隕石）は、図鑑が 12 種そろうと出る
let HIDDEN_ON = false;
let DEX_HAS = () => false;                       // その死に方が図鑑に載っているか
const dexOpen = () => DEATHS.filter(d => !d.hidden && !DEX_HAS(d.id)).length;   // 図鑑の空き
const dexRegular = () => DEATHS.filter(d => !d.hidden).length;                  // 隠し枠をのぞく種類数

// 死に方の重み。図鑑にまだ載っていない死に方は、載っている数が増えるほど太くなる（最大 1+CFG.boostMax 倍）。
// まれな死に方ほど出ないので、そのままだと図鑑の最後が埋まらなくなるのを防ぐ（設定資料 5.10）
function wheelWeight(i) {
  const d = DEATHS[i];
  if (DEX_HAS(d.id)) return d.weight;      // 隠し枠（隕石）も、出られるようになったあとはまだ載っていなければ最大まで太くなる（約 15%）
  const got = dexRegular() - dexOpen();
  return d.weight * (1 + CFG.boostMax * Math.max(0, Math.min(1, (got - CFG.boostFrom) / (dexRegular() - 1 - CFG.boostFrom))));
}

// 出る可能性のある死に方（番号）。隠し枠は図鑑がそろうまで出ない
function candidates() {
  const out = [];
  DEATHS.forEach((d, i) => { if (!d.hidden || HIDDEN_ON) out.push(i); });
  return out;
}

// 死に方をひとつ決める
function pickDeath(rng) {
  const list = candidates();
  const total = list.reduce((s, i) => s + wheelWeight(i), 0);
  let r = rng() * total;
  for (const i of list) { r -= wheelWeight(i); if (r < 0) return i; }
  return list[list.length - 1];
}

const Game = {
  reset(seed) {
    this.rng = mulberry32(seed == null ? (Math.random() * 2147483647) | 0 : seed);
    this.phase = 'ready';      // ready → dead（もう一度は ready に戻して die）
    this.deathIdx = -1;
    this.tPhase = 0;
  },
  // 死ぬ（死に方が決まる）
  die() {
    if (this.phase !== 'ready') return false;
    this.deathIdx = pickDeath(this.rng);
    this.phase = 'dead';
    this.tPhase = 0;
    return true;
  },
  // もう一度（すぐ次の死に方）
  again() {
    this.phase = 'ready';
    return this.die();
  },
  step(dt) { this.tPhase += dt; },
};

// ひと（非常口マークのようなピクトグラム）。足もとが原点、上が -y。pose: stand | cheer | down

  ctx.save();

  ctx.lineWidth = 2.6;                                     // 腕
  ctx.beginPath();
  if (pose === 'cheer') { ctx.moveTo(-3, -13); ctx.lineTo(-7.5, -21); ctx.moveTo(3, -13); ctx.lineTo(7.5, -21); }
  else if (pose === 'down') { ctx.moveTo(-3, -12); ctx.lineTo(-8, -13); ctx.moveTo(3, -12); ctx.lineTo(8, -14); }
  else if (pose === 'startle') { ctx.moveTo(-3.4, -12.5); ctx.lineTo(-8.5, -9); ctx.moveTo(3.4, -12.5); ctx.lineTo(8.5, -9); }

  if (pose === 'startle') {                                // 頭の上に注意標識の「！」
    ctx.fillStyle = '#ffcc00'; ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -35); ctx.lineTo(5, -26.5); ctx.lineTo(-5, -26.5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-0.55, -33, 1.1, 3.6); circle(0, -27.9, 0.7); ctx.fill();

// ホーム画面：おおきなピクトグラムが立っている（死ぬと、ここに倒れる）
function render(dt) {

// ===== 死亡演出の背景（動画は使わず、全部コードで描く）=====

// ピクトグラムはこの上に 70-cine.js が重ねる。寄り・揺れも 70-cine.js が全体にかける
const Scenes = {};
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth = v => { v = clamp01(v); return v * v * (3 - 2 * v); };
const rgbMix = (c1, c2, t) => 'rgb(' + Math.round(lerp(c1[0], c2[0], t)) + ',' + Math.round(lerp(c1[1], c2[1], t)) + ',' + Math.round(lerp(c1[2], c2[2], t)) + ')';

// ぎざぎざの稲妻（中点をずらして分けていく）。枝つき
function boltPath(rnd, x0, y0, x1, y1, spread, depth) {
  let pts = [[x0, y0], [x1, y1]];
  for (let d = 0; d < 5; d++) {
    const next = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      next.push([(a[0] + b[0]) / 2 + (rnd() - 0.5) * spread / (d + 1), (a[1] + b[1]) / 2 + (rnd() - 0.5) * spread * 0.25 / (d + 1)], b);
    }
    pts = next;
  }
  const out = [pts];
  if (depth > 0) {
    for (let i = 3; i < pts.length - 3; i += 6) {
      if (rnd() < 0.55) {
        const p = pts[i], dir = rnd() < 0.5 ? -1 : 1;
        out.push(...boltPath(rnd, p[0], p[1], p[0] + dir * (6 + rnd() * 12), p[1] + 14 + rnd() * 18, 5, depth - 1));
      }
    }
  }

}
function strokeBolt(ctx, paths, a) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  [[3.2, 0.16, '#9cc8ff'], [1.4, 0.5 * a, '#cfe6ff'], [0.55, a, '#ffffff']].forEach(([w, al, col]) => {
    ctx.strokeStyle = col; ctx.globalAlpha = al; ctx.lineWidth = w;
    paths.forEach((pts, k) => {
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    });
  });
  ctx.globalAlpha = 1;
}

// 落雷：のどかな野原 → 積乱雲がわき上がる → 雨と風 → 雲の中で雷が光る → 稲妻が地面に届く
Scenes.rakurai = (() => {
  const W = CFG.worldW, H = CFG.worldH, HZ = 128;
  const r0 = mulberry32(7);
  const blobs = [];
  for (let i = 0; i < 110; i++) {
    blobs.push({ x: 50 + (r0() - 0.5) * 120 * (0.35 + 0.65 * r0()), y: lerp(HZ - 6, 8, Math.pow(r0(), 0.85)), r: 9 + r0() * 17, d: r0() * TAU });
  }
  blobs.sort((a, b) => a.y - b.y);
  const small = [[18, 30, 12], [70, 20, 9], [46, 52, 14], [84, 62, 10], [26, 78, 11]];
  const blades = [];
  for (let i = 0; i < 320; i++) blades.push({ x: r0() * W, y: HZ + 1 + Math.pow(r0(), 0.7) * (H - HZ), s: r0() * TAU });
  const flashes = [[0.9, 0.14, 30], [1.55, 0.12, 66], [2.05, 0.12, 42], [2.5, 0.16, 56]];

  return function (ctx, t, p) {
    const g = smooth(p * 1.1);                    // 雲のわき上がり
    // 空
    const sky = ctx.createLinearGradient(0, 0, 0, HZ);
    sky.addColorStop(0, rgbMix([64, 148, 226], [18, 24, 36], Math.pow(p, 1.1)));
    sky.addColorStop(1, rgbMix([205, 230, 250], [98, 110, 128], p));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HZ + 1);
    // のどかな小さい雲（嵐が来ると消える）
    ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * (1 - smooth(p * 1.6))).toFixed(3) + ')';
    small.forEach(([x, y, r], i) => {
      const dx = (x + t * 1.6 * (0.5 + i * 0.2)) % 130 - 15;
      ctx.beginPath(); ctx.ellipse(dx, y, r * 1.4, r * 0.5, 0, 0, TAU); ctx.ellipse(dx + r * 0.6, y - r * 0.2, r * 0.8, r * 0.5, 0, 0, TAU); ctx.fill();
    });
    // 積乱雲：地平線から立ち上がる。上は明るく、底は暗い
    const base = [150, 165, 185], top = [245, 248, 255], baseS = [20, 26, 38], topS = [92, 104, 124];
    const cb = base.map((v, i) => lerp(v, baseS[i], p)), ct = top.map((v, i) => lerp(v, topS[i], p));
    blobs.forEach(b => {
      const h = (HZ - b.y) / (HZ - 8);
      const yy = HZ - (HZ - b.y) * (0.1 + 0.9 * g);
      const rr = b.r * (0.45 + 0.75 * g);
      const w = Math.sin(t * 0.5 + b.d) * 1.2;
      ctx.fillStyle = rgbMix(cb, ct, Math.min(1, h * 0.75));
      ctx.beginPath(); ctx.arc(b.x + w, yy, rr, 0, TAU); ctx.fill();
    });
    // 雨のカーテン
    const rain = ctx.createLinearGradient(0, 60, 0, HZ);
    rain.addColorStop(0, 'rgba(60,70,86,0)'); rain.addColorStop(1, 'rgba(70,82,100,' + (0.55 * g).toFixed(3) + ')');
    ctx.fillStyle = rain; ctx.fillRect(14, 60, 72, HZ - 60);
    // 地面と草
    const gr = ctx.createLinearGradient(0, HZ, 0, H);
    gr.addColorStop(0, rgbMix([128, 156, 78], [58, 74, 52], p)); gr.addColorStop(1, rgbMix([70, 104, 48], [22, 34, 26], p));
    ctx.fillStyle = gr; ctx.fillRect(0, HZ, W, H - HZ);
    const wind = 0.25 + 1.7 * p;
    ctx.lineCap = 'round';
    blades.forEach(b => {
      const len = 2.2 + (b.y - HZ) / (H - HZ) * 7;
      const sw = Math.sin(t * (3 + wind) + b.x * 0.4 + b.s) * wind * len * 0.35 + wind * len * 0.25;
      ctx.strokeStyle = rgbMix([118, 150, 64], [34, 48, 34], p * 0.8 + (b.y - HZ) / (H - HZ) * 0.2);
      ctx.lineWidth = 0.5 + (b.y - HZ) / (H - HZ) * 0.7;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + sw, b.y - len); ctx.stroke();
    });
    // 雨すじ（後半）
    if (p > 0.45) {
      const n = Math.floor(70 * clamp01((p - 0.45) / 0.55));
      ctx.strokeStyle = 'rgba(210,225,245,0.35)'; ctx.lineWidth = 0.25;
      const rr = mulberry32(Math.floor(t * 30) + 11);
      for (let i = 0; i < n; i++) {
        const x = rr() * W, y = rr() * H;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2.5, y + 9); ctx.stroke();
      }
    }
    // 雲の中の雷（ぱっと光る）
    let glow = 0;
    flashes.forEach(([t0, dur, fx]) => {
      const u = (t - t0) / dur;
      if (u >= 0 && u < 1) {
        const a = 1 - u;
        glow = Math.max(glow, a * 0.5);
        const rg = ctx.createRadialGradient(fx, 46, 2, fx, 46, 36);
        rg.addColorStop(0, 'rgba(230,240,255,' + (0.85 * a).toFixed(3) + ')'); rg.addColorStop(1, 'rgba(230,240,255,0)');
        ctx.fillStyle = rg; ctx.fillRect(0, 0, W, HZ);
        strokeBolt(ctx, boltPath(mulberry32(Math.floor(t0 * 100)), fx, 30, fx + 10, 70, 10, 1), 0.7 * a);
      }
    });
    // 稲妻が地面まで届く：だんだん太く・チカチカ
    if (t > 2.7) {
      const rr = mulberry32(Math.floor(t * 11) + 3);
      const gp = clamp01((t - 2.7) / 0.6);
      const flick = 0.55 + 0.45 * ((Math.floor(t * 22) % 2) ? 1 : 0.6);
      strokeBolt(ctx, boltPath(rr, 55, 18, 52, HZ + 6, 12, 2), flick * (0.6 + 0.4 * gp));
      glow = Math.max(glow, 0.3 + 0.4 * gp);
      const gg = ctx.createRadialGradient(52, HZ + 4, 1, 52, HZ + 4, 30);
      gg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * gp).toFixed(3) + ')'); gg.addColorStop(1, 'rgba(200,225,255,0)');
      ctx.fillStyle = gg; ctx.fillRect(0, HZ - 30, W, 60);
    }
    if (glow > 0) { ctx.fillStyle = 'rgba(220,235,255,' + (glow * 0.35).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    // 四隅を暗く（映画のように）
    const vg = ctx.createRadialGradient(50, 95, 30, 50, 95, 105);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,' + (0.15 + 0.5 * p).toFixed(3) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  };
})();
// ===== 死亡演出の背景（残りの 12 場面）。どれも Scenes.<id>(ctx, t, p)：t=経過秒、p=直撃までの進み(0〜1) =====
// 部品：塗りつぶし・雲のかたまり・霧・四隅の暗さ・粒（雪・胞子・ハチなど）。どの場面も全面を塗る
const SW = CFG.worldW, SH = CFG.worldH;
const rgb = (r, g, b) => 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
function vgrad(ctx, y0, y1, c0, c1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fillRect(0, y0, SW, y1 - y0 + 1);
}
function dark(ctx, a) { if (a > 0) { ctx.fillStyle = 'rgba(0,0,0,' + a.toFixed(3) + ')'; ctx.fillRect(0, 0, SW, SH); } }
function vig(ctx, a) {
  const g = ctx.createRadialGradient(50, 95, 30, 50, 95, 105);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,' + a.toFixed(3) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, SW, SH);
}
function disc(ctx, x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function fog(ctx, a, y0, y1, col) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, 'rgba(' + col + ',0)'); g.addColorStop(0.5, 'rgba(' + col + ',' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
  ctx.fillStyle = g; ctx.fillRect(0, y0, SW, y1 - y0);
}
// 乱数で作った粒の配列
function seeded(seed, n, f) { const r = mulberry32(seed), a = []; for (let i = 0; i < n; i++) a.push(f(r, i)); return a; }

// ---- 家 ----
// 餅：こたつの部屋。お雑煮の餅がどんどん伸びて大きくなる。部屋が暗くなる
const mochiSteam = seeded(21, 14, r => ({ x: 36 + r() * 28, s: r(), w: r() * TAU }));
Scenes.mochi = function (ctx, t, p) {
  vgrad(ctx, 0, 112, rgb(238, 212, 170), rgb(205, 160, 110));
  ctx.fillStyle = rgb(170, 110, 70); ctx.fillRect(0, 112, SW, SH - 112);            // 床
  ctx.fillStyle = rgb(150, 92, 56); for (let i = 0; i < 9; i++) ctx.fillRect(0, 118 + i * 9, SW, 0.6);
  ctx.fillStyle = rgb(205, 110, 60); ctx.fillRect(10, 96, 80, 40);                   // こたつ布団
  ctx.fillStyle = rgb(160, 100, 60); ctx.fillRect(7, 88, 86, 9);                     // 天板
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(50, 88, 14, 5, 0, 0, TAU); ctx.fill();   // 椀
  ctx.fillStyle = rgb(190, 40, 40); ctx.beginPath(); ctx.ellipse(50, 87, 11, 3.2, 0, 0, TAU); ctx.fill();
  // 湯気
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 0.8;
  mochiSteam.forEach(s => { const ph = (t * 0.5 + s.s) % 1; ctx.beginPath(); ctx.moveTo(s.x, 84 - ph * 6); ctx.bezierCurveTo(s.x + 3, 76 - ph * 20, s.x - 3, 64 - ph * 24, s.x + Math.sin(t + s.w) * 3, 56 - ph * 30); ctx.stroke(); });
  // 伸びる餅
  const g = smooth(p), top = 84 - 66 * g, sway = Math.sin(t * 2.4) * 3 * g;
  ctx.strokeStyle = '#fffdf2'; ctx.lineCap = 'round';
  ctx.lineWidth = lerp(7, 3.5, g); ctx.beginPath(); ctx.moveTo(50, 87); ctx.quadraticCurveTo(50 + sway * 2, (87 + top) / 2, 50 + sway, top); ctx.stroke();
  disc(ctx, 50 + sway, top, lerp(7, 15, g), '#fffdf2');
  ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.arc(50 + sway, top, lerp(7, 15, g) - 0.5, 0.4, 2.2); ctx.stroke();
  vig(ctx, 0.15 + 0.55 * p); dark(ctx, 0.25 * smooth(p * 1.3 - 0.3));
};

// 雪下ろし：軒下に立つ。屋根の雪がずるずる動き、大きなかたまりが落ちてくる
const snowFall = seeded(22, 90, r => ({ x: r() * SW, y: r() * SH, v: 8 + r() * 14, s: 0.4 + r() * 0.8 }));
Scenes.yuki = function (ctx, t, p) {
  vgrad(ctx, 0, SH, rgb(190, 202, 216), rgb(235, 240, 246));
  ctx.fillStyle = rgb(214, 196, 168); ctx.fillRect(0, 62, SW, 90);                    // 家の壁
  ctx.fillStyle = rgb(120, 100, 80); for (let i = 0; i < 8; i++) ctx.fillRect(i * 13 + 3, 78, 8, 16);  // 窓がわり
  ctx.fillStyle = rgb(70, 70, 80); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(SW, 0); ctx.lineTo(SW, 52); ctx.lineTo(0, 64); ctx.closePath(); ctx.fill();   // 屋根
  ctx.fillStyle = '#f7fafc'; ctx.fillRect(0, 150, SW, SH - 150);                      // 雪の地面
  const g = smooth(p);
  // 屋根の雪（ずり落ちる）
  const slide = g * g * 78, rot = g * 0.35;
  ctx.save(); ctx.translate(50, 30 + slide); ctx.rotate(-rot * 0.25);
  ctx.fillStyle = '#fbfdff'; ctx.beginPath(); ctx.moveTo(-50 - 6, -22); ctx.lineTo(56, -22); ctx.lineTo(56 + g * 5, 22 + g * 22); ctx.quadraticCurveTo(0, 30 + g * 22, -56, 18 + g * 14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(120,150,190,0.5)'; ctx.lineWidth = 0.7; ctx.stroke(); ctx.restore();
  // つらら
  ctx.fillStyle = 'rgba(230,245,255,0.9)'; for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.moveTo(i * 9 + 2, 58 + slide * 0.2); ctx.lineTo(i * 9 + 5, 58 + slide * 0.2); ctx.lineTo(i * 9 + 3.5, 66 + (i % 3) * 3 + slide * 0.2); ctx.fill(); }
  // 雪
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  snowFall.forEach(s => { const y = (s.y + t * s.v) % SH, x = s.x + Math.sin(t + s.s * 9) * 2; ctx.beginPath(); ctx.arc(x, y, s.s, 0, TAU); ctx.fill(); });
  vig(ctx, 0.12 + 0.4 * p);
};

// フグ：夜の台所。ライトがちらつき、フグがふくらんで目が光る
Scenes.fugu = function (ctx, t, p) {
  vgrad(ctx, 0, SH, rgb(14, 18, 28), rgb(30, 26, 30));
  ctx.fillStyle = rgb(56, 48, 44); ctx.fillRect(0, 108, SW, 70);                     // カウンター
  ctx.fillStyle = rgb(210, 180, 130); ctx.fillRect(14, 104, 72, 6);                   // まな板
  const fl = 0.55 + 0.45 * (Math.sin(t * 37) * Math.sin(t * 23) > 0.2 ? 1 : 0.35) * (p > 0.5 ? 1 : 0.9 + 0.1 * Math.sin(t * 5));
  // ライトの光
  const lg = ctx.createRadialGradient(50, 98, 2, 50, 98, 55);
  lg.addColorStop(0, 'rgba(255,240,200,' + (0.55 * fl).toFixed(3) + ')'); lg.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 40, SW, 110);
  // フグ
  const s = 1 + 0.5 * smooth(p);
  ctx.save(); ctx.translate(50, 94); ctx.scale(s, s);
  ctx.fillStyle = rgb(226, 214, 176); ctx.beginPath(); ctx.ellipse(0, 0, 17, 12, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(27, -7); ctx.lineTo(27, 7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgb(120, 110, 92); [[-6, -6, 2.4], [2, -8, 2], [8, -3, 2.2], [-1, -3, 1.6]].forEach(([x, y, r]) => disc(ctx, x, y, r, rgb(120, 110, 92)));
  ctx.fillStyle = rgb(236, 226, 200); ctx.beginPath(); ctx.ellipse(-2, 7, 11, 4, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgb(120, 110, 92); ctx.lineWidth = 0.8; for (let i = 0; i < 9; i++) { const a = Math.PI * (0.1 + i * 0.1) * 1.6 + 3.3; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 16, Math.sin(a) * 11); ctx.lineTo(Math.cos(a) * (19 + 3 * p), Math.sin(a) * (14 + 3 * p)); ctx.stroke(); }
  disc(ctx, -10, -3, 3.2, '#fff'); disc(ctx, -10, -3, 1.6, '#111');
  const eg = clamp01((p - 0.5) / 0.5); if (eg > 0) { disc(ctx, -10, -3, 3.6, 'rgba(255,60,40,' + (0.8 * eg).toFixed(3) + ')'); disc(ctx, -10, -3, 1.6, '#111'); }
  ctx.restore();
  vig(ctx, 0.35 + 0.5 * p);
};

// 毒キノコ：うす暗い森。きれいなキノコがほのかに光り、胞子が漂い、霧が濃くなる
const sporeP = seeded(24, 50, r => ({ x: r() * SW, y: r() * SH, s: 0.3 + r() * 0.7, w: r() * TAU }));
Scenes.kinoko = function (ctx, t, p) {
  vgrad(ctx, 0, 130, rgb(20, 34, 30), rgb(44, 70, 56));
  const tr = seeded(25, 9, r => ({ x: r() * SW, w: 4 + r() * 6, c: 20 + r() * 20 }));
  tr.forEach(o => { ctx.fillStyle = rgb(o.c, o.c + 16, o.c + 8); ctx.fillRect(o.x, 0, o.w, 135); });
  vgrad(ctx, 128, SH, rgb(46, 62, 36), rgb(24, 34, 22));
  fog(ctx, 0.25 + 0.4 * p, 70, 150, '170,200,180');
  const g = smooth(p), gl = 0.35 + 0.35 * Math.sin(t * 3) * 0.3 + 0.5 * g;
  const cg = ctx.createRadialGradient(50, 140, 2, 50, 140, 38 + 20 * g);
  cg.addColorStop(0, 'rgba(255,150,210,' + gl.toFixed(3) + ')'); cg.addColorStop(1, 'rgba(255,150,210,0)');
  ctx.fillStyle = cg; ctx.fillRect(0, 90, SW, 80);
  [[40, 142, 0.9], [50, 138, 1.3], [61, 143, 0.8], [33, 146, 0.6], [68, 147, 0.55]].forEach(([x, y, k]) => {
    const sc = k * (1 + 0.5 * g);
    ctx.fillStyle = rgb(230, 225, 205); ctx.fillRect(x - 1.6 * sc, y - 4 * sc, 3.2 * sc, 8 * sc);
    ctx.fillStyle = rgb(210, 60, 120); ctx.beginPath(); ctx.ellipse(x, y - 4 * sc, 8 * sc, 5 * sc, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; [[-3, -6], [2, -7], [5, -5]].forEach(([dx, dy]) => disc(ctx, x + dx * sc, y + dy * sc, 0.9 * sc, '#fff'));
  });
  ctx.fillStyle = 'rgba(255,200,240,0.7)';
  sporeP.forEach(s => { const y = (s.y - t * 3 * s.s + SH) % SH, x = s.x + Math.sin(t * 0.8 + s.w) * 4; ctx.beginPath(); ctx.arc(x, y, 0.5 * s.s + 0.3, 0, TAU); ctx.fill(); });
  vig(ctx, 0.3 + 0.5 * p);
};

// お風呂：湯気で画面が真っ白になっていく。のぼせて赤くなる
const bathSteam = seeded(26, 26, r => ({ x: r() * SW, y: 40 + r() * 120, r: 8 + r() * 16, s: r(), w: r() * TAU }));
Scenes.furo = function (ctx, t, p) {
  vgrad(ctx, 0, 120, rgb(176, 208, 218), rgb(150, 188, 200));
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 0.5;
  for (let x = 0; x <= SW; x += 12) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 120); ctx.stroke(); }
  for (let y = 0; y <= 120; y += 12) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(SW, y); ctx.stroke(); }
  ctx.fillStyle = rgb(236, 240, 242); ctx.beginPath(); ctx.moveTo(0, 118); ctx.lineTo(SW, 118); ctx.lineTo(SW, SH); ctx.lineTo(0, SH); ctx.closePath(); ctx.fill();  // 浴槽
  vgrad(ctx, 128, SH, rgb(120, 190, 220), rgb(80, 160, 200));                        // お湯
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 0.6;
  for (let i = 0; i < 6; i++) { ctx.beginPath(); for (let x = 0; x <= SW; x += 4) ctx.lineTo(x, 134 + i * 7 + Math.sin(x * 0.2 + t * 2 + i) * 1); ctx.stroke(); }
  const g = smooth(p);
  bathSteam.forEach(s => {
    const ph = (t * 0.25 + s.s) % 1, y = s.y - ph * 40 * (0.5 + g), x = s.x + Math.sin(t * 0.7 + s.w) * 6;
    const gr = ctx.createRadialGradient(x, y, 1, x, y, s.r * (1 + g));
    gr.addColorStop(0, 'rgba(255,255,255,' + (0.18 + 0.4 * g).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(x - s.r * 2, y - s.r * 2, s.r * 4, s.r * 4);
  });
  ctx.fillStyle = 'rgba(255,255,255,' + (0.45 * g).toFixed(3) + ')'; ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = 'rgba(255,90,70,' + (0.3 * g * g).toFixed(3) + ')'; ctx.fillRect(0, 0, SW, SH);   // のぼせ
  vig(ctx, 0.15 + 0.5 * p);
};

// ---- 山 ----
// ハチ：夏の山道。ハチの群れが寄ってきて、画面をうめる
const bees = seeded(31, 70, r => ({ sx: 70 + r() * 60, sy: -10 + r() * 90, d: r() * 1.6, w: r() * TAU, k: 0.6 + r() * 0.8 }));
Scenes.hachi = function (ctx, t, p) {
  vgrad(ctx, 0, 100, rgb(96, 176, 232), rgb(200, 232, 248));
  [[rgb(120, 168, 120), 88, 16], [rgb(86, 140, 90), 100, 22], [rgb(60, 112, 66), 112, 20]].forEach(([c, y, h], i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, y); for (let x = 0; x <= SW; x += 10) ctx.lineTo(x, y - Math.sin(x * 0.07 + i * 2) * h * 0.5); ctx.lineTo(SW, SH); ctx.lineTo(0, SH); ctx.fill(); });
  vgrad(ctx, 122, SH, rgb(168, 130, 88), rgb(120, 90, 60));                           // 道
  ctx.fillStyle = rgb(70, 130, 60); for (let i = 0; i < 40; i++) { const x = (i * 37) % SW; ctx.fillRect(x, 122 + (i * 13) % 6, 0.8, 5); }
  const tx = 50, ty = 120;
  bees.forEach(b => {
    const u = clamp01((p * 1.15 - b.d * 0.35) / 0.65), e = u * u * (3 - 2 * u);
    const x = lerp(b.sx, tx + Math.sin(b.w + t * 6) * 10 * b.k, e) + Math.sin(t * 9 + b.w) * 1.2, y = lerp(b.sy, ty + Math.cos(b.w * 2 + t * 7) * 14 * b.k, e) + Math.cos(t * 11 + b.w) * 1.2;
    const s = 0.8 + 1.6 * e * b.k;
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.ellipse(x, y, 1.6 * s, 1.1 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffcc00'; ctx.fillRect(x - 0.4 * s, y - 1 * s, 0.7 * s, 2 * s);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(x - 0.2 * s, y - 1.3 * s, 1 * s, 0.6 * s, Math.sin(t * 60 + b.w) * 0.5, 0, TAU); ctx.fill();
  });
  dark(ctx, 0.5 * smooth((p - 0.55) / 0.45)); vig(ctx, 0.1 + 0.4 * p);
};

// 毒ヘビ：足もとの落ち葉。ヘビが横からすべってくる
const leaves = seeded(32, 60, r => ({ x: r() * SW, y: 100 + r() * 78, a: r() * TAU, k: 2 + r() * 3, c: r() }));
Scenes.hebi = function (ctx, t, p) {
  vgrad(ctx, 0, 100, rgb(40, 64, 40), rgb(74, 102, 60));
  ctx.fillStyle = rgb(30, 50, 32); for (let i = 0; i < 6; i++) ctx.fillRect(i * 19 + 4, 0, 7, 105);
  vgrad(ctx, 100, SH, rgb(96, 70, 40), rgb(60, 44, 28));
  leaves.forEach(l => { ctx.fillStyle = l.c < 0.4 ? rgb(150, 90, 40) : (l.c < 0.7 ? rgb(176, 130, 50) : rgb(110, 70, 36)); ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.a); ctx.beginPath(); ctx.ellipse(0, 0, l.k, l.k * 0.5, 0, 0, TAU); ctx.fill(); ctx.restore(); });
  // ヘビ：右から体をくねらせて進む
  const head = lerp(128, 50, smooth(Math.min(1, p * 1.15))), N = 60, wid = 5.2 + 2.4 * p;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass === 0 ? '#2a2f1c' : rgb(110, 120, 56); ctx.lineWidth = pass === 0 ? wid + 1.2 : wid;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) { const x = head + i * 2.2, y = 150 + Math.sin(i * 0.28 - t * 5) * 6 * (0.4 + i / N * 0.6); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.strokeStyle = rgb(70, 60, 30); ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 4; i <= N; i += 6) { const x = head + i * 2.2, y = 150 + Math.sin(i * 0.28 - t * 5) * 6 * (0.4 + i / N * 0.6); ctx.moveTo(x, y - wid / 2); ctx.lineTo(x, y + wid / 2); } ctx.stroke();
  const hy = 150 + Math.sin(-t * 5) * 2.4;
  ctx.fillStyle = rgb(120, 130, 60); ctx.beginPath(); ctx.ellipse(head - 1, hy, 4.6, 3.4, 0, 0, TAU); ctx.fill();
  disc(ctx, head - 1.5, hy - 1.2, 0.9, '#ffd700'); disc(ctx, head - 1.5, hy - 1.2, 0.4, '#111');
  if (Math.sin(t * 12) > 0) { ctx.strokeStyle = '#d02020'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(head - 5, hy); ctx.lineTo(head - 9, hy); ctx.lineTo(head - 10.5, hy - 1.2); ctx.moveTo(head - 9, hy); ctx.lineTo(head - 10.5, hy + 1.2); ctx.stroke(); }
  vig(ctx, 0.25 + 0.45 * p);
};

// 雪崩：雪山の斜面。上から白い雪煙のかたまりが、どんどん大きくなって降りてくる
const sn = seeded(33, 80, r => ({ x: r() * 120 - 10, y: r(), r: 6 + r() * 14, w: r() * TAU, v: 0.6 + r() * 0.8 }));
Scenes.nadare = function (ctx, t, p) {
  vgrad(ctx, 0, 90, rgb(92, 150, 220), rgb(190, 222, 246));
  ctx.fillStyle = rgb(245, 248, 252); ctx.beginPath(); ctx.moveTo(-5, 100); ctx.lineTo(40, 14); ctx.lineTo(70, 54); ctx.lineTo(105, 8); ctx.lineTo(105, 120); ctx.closePath(); ctx.fill();   // 山
  ctx.fillStyle = rgb(196, 214, 236); ctx.beginPath(); ctx.moveTo(40, 14); ctx.lineTo(70, 54); ctx.lineTo(56, 110); ctx.lineTo(30, 60); ctx.closePath(); ctx.fill();   // 山の影
  vgrad(ctx, 100, SH, rgb(236, 242, 250), rgb(206, 220, 238));                         // 雪の斜面
  ctx.strokeStyle = 'rgba(150,170,200,0.5)'; ctx.lineWidth = 0.5; for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.moveTo(10 + i * 14, 178); ctx.lineTo(30 + i * 9, 110); ctx.stroke(); }
  const g = smooth(p), front = lerp(-20, 118, g * g);
  sn.forEach(b => {
    const y = front - b.y * 70 * (0.4 + g) + Math.sin(t * 3 + b.w) * 2, r = b.r * (0.8 + 1.4 * g);
    if (y < -r) return;
    const gr = ctx.createRadialGradient(b.x, y, r * 0.1, b.x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.97)'); gr.addColorStop(1, 'rgba(235,242,252,0.0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(b.x, y, r, 0, TAU); ctx.fill();
  });
  const mass = ctx.createLinearGradient(0, front - 40, 0, front + 30); mass.addColorStop(0, 'rgba(255,255,255,0)'); mass.addColorStop(1, 'rgba(255,255,255,' + (0.85 * g).toFixed(3) + ')');
  ctx.fillStyle = mass; ctx.fillRect(0, 0, SW, SH);
  vig(ctx, 0.1 + 0.3 * p);
};

// 山の遭難：夕ぐれの尾根。霧が出て、道が二つに分かれ、暗くなる
Scenes.sangaku = function (ctx, t, p) {
  vgrad(ctx, 0, 110, rgb(lerp(110, 22, p), lerp(160, 18, p), lerp(210, 40, p)), rgb(lerp(250, 70, p), lerp(190, 40, p), lerp(120, 60, p)));
  [[rgb(86, 100, 120), 70, 30], [rgb(58, 72, 92), 88, 26], [rgb(34, 46, 62), 104, 22]].forEach(([c, y, h], i) => {
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, SH); ctx.lineTo(0, y);
    for (let x = 0; x <= SW; x += 6) ctx.lineTo(x, y - Math.abs(Math.sin(x * 0.045 + i * 1.7)) * h);
    ctx.lineTo(SW, SH); ctx.fill();
  });
  vgrad(ctx, 112, SH, rgb(70, 78, 56), rgb(36, 40, 30));
  ctx.strokeStyle = rgb(206, 190, 150); ctx.lineCap = 'round'; ctx.lineWidth = 5;                         // 道（二手に分かれる）
  ctx.beginPath(); ctx.moveTo(50, 178); ctx.lineTo(50, 150); ctx.stroke();
  ctx.lineWidth = 3.2; ctx.beginPath(); ctx.moveTo(50, 150); ctx.quadraticCurveTo(36, 134, 22, 116); ctx.moveTo(50, 150); ctx.quadraticCurveTo(64, 134, 84, 118); ctx.stroke();
  fog(ctx, 0.3 + 0.5 * p, 60, 150, '210,218,226');
  fog(ctx, 0.2 + 0.45 * p, 110, 178, '210,218,226');
  if (p > 0.6) { ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * (p - 0.6)).toFixed(3) + ')'; [[18, 14], [60, 22], [80, 10], [35, 30], [90, 36]].forEach(([x, y]) => ctx.fillRect(x, y, 0.8, 0.8)); }
  dark(ctx, 0.5 * smooth((p - 0.3) / 0.7)); vig(ctx, 0.2 + 0.4 * p);
};

// ---- 海 ----
// 釣り：夕ぐれの防波堤。大きな波がせり上がってくる
const spray = seeded(41, 40, r => ({ x: r() * SW, s: r(), v: 10 + r() * 18 }));
Scenes.tsuri = function (ctx, t, p) {
  vgrad(ctx, 0, 96, rgb(lerp(250, 30, p * 0.8), lerp(170, 24, p * 0.8), lerp(120, 50, p * 0.8)), rgb(lerp(255, 120, p * 0.8), lerp(214, 70, p * 0.8), lerp(150, 90, p * 0.8)));
  disc(ctx, 78, 84, 9, 'rgba(255,230,170,' + (0.9 * (1 - p)).toFixed(3) + ')');
  vgrad(ctx, 90, 140, rgb(40, 96, 120), rgb(14, 40, 64));                             // 海
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 0.5; for (let i = 0; i < 8; i++) { ctx.beginPath(); for (let x = 0; x <= SW; x += 5) ctx.lineTo(x, 96 + i * 5 + Math.sin(x * 0.15 + t * 1.5 + i) * 1.2); ctx.stroke(); }
  const g = smooth(p), wy = lerp(140, 24, g);                                          // 波
  ctx.fillStyle = rgb(18, 64, 96); ctx.beginPath(); ctx.moveTo(-5, 150); ctx.lineTo(-5, wy + 18);
  for (let x = -5; x <= 105; x += 5) ctx.lineTo(x, wy + Math.sin(x * 0.12 + t * 2) * 3 + Math.max(0, (x - 40) * 0.25) * g);
  ctx.lineTo(105, 150); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; for (let x = -5; x <= 105; x += 5) { ctx.beginPath(); ctx.arc(x, wy + Math.sin(x * 0.12 + t * 2) * 3 + Math.max(0, (x - 40) * 0.25) * g, 2.8, 0, TAU); ctx.fill(); }
  ctx.fillStyle = rgb(120, 124, 130); ctx.fillRect(0, 138, SW, SH - 138);              // 防波堤
  ctx.fillStyle = rgb(150, 154, 160); ctx.fillRect(0, 138, SW, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; spray.forEach(s => { const y = 138 - ((t * s.v + s.s * 60) % 60) * g, x = s.x; if (g > 0.15) ctx.fillRect(x, y, 0.7, 0.7); });

};

// 海で溺れる：晴れた浜。波打ち際の波が沖へ引いていく（離岸流）。海の色が濃くなる
Scenes.umi = function (ctx, t, p) {
  vgrad(ctx, 0, 70, rgb(86, 170, 236), rgb(190, 228, 250));
  const g = smooth(p);
  vgrad(ctx, 70, 128, rgb(lerp(60, 14, g), lerp(190, 74, g), lerp(210, 120, g)), rgb(lerp(30, 8, g), lerp(130, 50, g), lerp(180, 90, g)));
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.5;
  for (let i = 0; i < 12; i++) { const y = 74 + i * 4.5, x0 = ((t * (6 + g * 24) + i * 23) % 120) - 10; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + 8, y); ctx.stroke(); }
  ctx.fillStyle = rgb(160, 120, 90); ctx.fillRect(0, 122, 6, 2);
  vgrad(ctx, 124, SH, rgb(236, 214, 170), rgb(206, 178, 130));                         // 砂浜
  // 引いていく波（岸から沖へ）
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let k = 0; k < 4; k++) { const ph = (t * (0.5 + g * 1.1) + k / 4) % 1, y = 128 - ph * 52; ctx.beginPath(); for (let x = 0; x <= SW; x += 4) ctx.lineTo(x, y + Math.sin(x * 0.2 + k) * 1.4); ctx.lineTo(SW, y + 2.4); ctx.lineTo(0, y + 2.4); ctx.fill(); }
  // 沖へのびる暗い筋（離岸流）
  const rip = ctx.createLinearGradient(0, 70, 0, 130); rip.addColorStop(0, 'rgba(10,40,70,0)'); rip.addColorStop(1, 'rgba(10,40,70,' + (0.5 * g).toFixed(3) + ')');
  ctx.fillStyle = rip; ctx.beginPath(); ctx.moveTo(36, 130); ctx.lineTo(64, 130); ctx.lineTo(54, 70); ctx.lineTo(46, 70); ctx.fill();
  dark(ctx, 0.3 * g); vig(ctx, 0.12 + 0.4 * p);
};

// 隕石（隠し枠）：夜空の星。光る点がみるみる大きくなり、火の玉になる。一番派手
const stars = seeded(51, 110, r => ({ x: r() * SW, y: r() * 130, s: 0.3 + r() * 0.8, w: r() * TAU }));
Scenes.inseki = function (ctx, t, p) {
  vgrad(ctx, 0, SH, rgb(6, 8, 24), rgb(22, 24, 52));
  stars.forEach(s => { ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.4 * Math.sin(t * 2 + s.w)).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(s.x, s.y, s.s * 0.6, 0, TAU); ctx.fill(); });
  ctx.fillStyle = rgb(10, 12, 20); ctx.beginPath(); ctx.moveTo(0, 150); for (let x = 0; x <= SW; x += 8) ctx.lineTo(x, 142 - Math.abs(Math.sin(x * 0.06)) * 18); ctx.lineTo(SW, SH); ctx.lineTo(0, SH); ctx.fill();
  const g = p * p, x = lerp(80, 52, p), y = lerp(8, 118, g), r = lerp(0.8, 20, g);
  // 尾
  const tg = ctx.createLinearGradient(x + 34 * (1 - p) + 8, y - 70 * (1 - p) - 10, x, y);
  tg.addColorStop(0, 'rgba(255,170,60,0)'); tg.addColorStop(1, 'rgba(255,200,120,' + (0.9 * Math.min(1, p * 1.5)).toFixed(3) + ')');
  ctx.strokeStyle = tg; ctx.lineCap = 'round'; ctx.lineWidth = r * 1.6;
  ctx.beginPath(); ctx.moveTo(x + 60 * (1 - p) + 10, y - 100 * (1 - p) - 12); ctx.lineTo(x, y); ctx.stroke();
  const gl = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 3.2);
  gl.addColorStop(0, 'rgba(255,250,220,1)'); gl.addColorStop(0.35, 'rgba(255,170,60,0.6)'); gl.addColorStop(1, 'rgba(255,100,20,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, SW, SH);
  disc(ctx, x, y, r, rgb(255, 244, 200));
  ctx.fillStyle = 'rgba(255,230,190,' + (0.35 * g).toFixed(3) + ')'; ctx.fillRect(0, 0, SW, SH);   // 空全体が明るくなる
  vig(ctx, 0.25 * (1 - p));
};
// ===== 効果音（WebAudio で合成。音声ファイルなし・BGMなし）=====
const Snd = (() => {
  let ac = null, master = null, noiseBuf = null;

  function init() {
    if (!ac) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (_) { ac = null; return; }
    }
    if (ac.state === 'suspended') ac.resume();
  }
  const now = () => ac.currentTime;

  // f→f2 へ動く1音
  function tone(f, t0, dur, o) {
    if (!ac) return;
    o = o || {};
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
    const a = o.attack || 0.004, v = o.gain == null ? 0.3 : o.gain;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(o.dest || master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function noise(t0, dur, o) {
    if (!ac) return;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = o.type || 'bandpass';
    fl.frequency.setValueAtTime(o.f, t0); fl.Q.value = o.q || 1;
    if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain == null ? 0.3 : o.gain, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl); fl.connect(g); g.connect(o.dest || master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  }

  // 映像の間だけ鳴らす音をまとめる出口（飛ばすときに一気に切る）
  let bus = null;
  function cutBus() {
    if (bus && ac) { bus.gain.setTargetAtTime(0, now(), 0.02); }
    bus = null;
  }

  return {
    init,
    reset() { ac = null; bus = null; master = null; },   // 音量の測定用（audio-check.html）。ふだんは使わない
    // 落雷の映像：風が強まり、遠くで雷鳴、放電の音が高まる。impactT 秒で止まる（直撃の音は impact() を別に鳴らす）
    cineStart(impactT, kind) {
      if (!ac) return;
      cutBus();
      if (kind && kind !== 'storm') return this.cineOther(impactT, kind);
      const t = now();
      bus = ac.createGain(); bus.gain.value = 1; bus.connect(master);
      // 風：だんだん強く
      const w = ac.createBufferSource(); w.buffer = noiseBuf; w.loop = true;
      const wf = ac.createBiquadFilter(); wf.type = 'bandpass'; wf.Q.value = 0.8;
      wf.frequency.setValueAtTime(260, t); wf.frequency.linearRampToValueAtTime(820, t + impactT);
      const wg = ac.createGain();
      wg.gain.setValueAtTime(0.02, t); wg.gain.linearRampToValueAtTime(0.2, t + impactT);
      w.connect(wf); wf.connect(wg); wg.connect(bus);
      w.start(t, Math.random()); w.stop(t + impactT + 0.1);
      // 遠雷：だんだん近く大きく
      [[0.9, 0.18], [1.7, 0.26], [2.4, 0.36]].forEach(([at, v]) => {
        if (at < impactT - 0.2) noise(t + at, 1.3, { type: 'lowpass', f: 140, f2: 60, q: 0.7, gain: v, dest: bus });
      });
      // 放電が高まる音（直撃の直前）
      const s0 = Math.max(0, impactT - 0.8);
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t + s0); o.frequency.exponentialRampToValueAtTime(2600, t + impactT);
      og.gain.setValueAtTime(0.0001, t + s0); og.gain.exponentialRampToValueAtTime(0.07, t + impactT - 0.02); og.gain.exponentialRampToValueAtTime(0.0001, t + impactT);
      o.connect(og); og.connect(bus); o.start(t + s0); o.stop(t + impactT + 0.05);
      noise(t + s0, 0.8, { type: 'highpass', f: 5000, q: 0.5, gain: 0.09, dest: bus });
    },
    // 雷以外の場面の音：kind ごとに「じわじわ高まる音」を直撃（impactT 秒）まで鳴らす
    //  room：低いうなり＋だんだん速くなる鼓動／buzz：ハチの羽音／rumble：地鳴り／wind：風／water：波／space：近づく音
    cineOther(impactT, kind) {
      const t = now();
      bus = ac.createGain(); bus.gain.value = 1; bus.connect(master);
      const ramp = (g0, g1) => { const o = ac.createGain(); o.gain.setValueAtTime(g0, t); o.gain.linearRampToValueAtTime(g1, t + impactT); o.connect(bus); return o; };
      const loopNoise = (type, f0, f1, q) => {
        const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = q || 0.8;
        fl.frequency.setValueAtTime(f0, t); fl.frequency.linearRampToValueAtTime(f1, t + impactT);
        s.connect(fl); s.start(t, Math.random()); s.stop(t + impactT + 0.1); return fl;
      };
      const osc = (type, f0, f1) => {
        const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + impactT);
        o.start(t); o.stop(t + impactT + 0.1); return o;
      };
      if (kind === 'room') {
        const o = osc('sine', 52, 70), g = ramp(0.008, 0.045); o.connect(g);
        for (let b = 0.4, gap = 0.9; b < impactT - 0.15; b += gap, gap = Math.max(0.28, gap * 0.82)) {       // 鼓動：だんだん速く強く
          const v = 0.035 + 0.075 * (b / impactT);
          tone(60, t + b, 0.16, { type: 'sine', gain: v, f2: 38, dest: bus }); tone(60, t + b + 0.17, 0.14, { type: 'sine', gain: v * 0.7, f2: 36, dest: bus });
        }
      } else if (kind === 'buzz') {
        const o = osc('sawtooth', 150, 230), lf = ac.createOscillator(), lg = ac.createGain(), g = ramp(0.012, 0.1), lp = ac.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 800;
        const trem = ac.createGain(); trem.gain.value = 0.5;                       // 羽音のふるえ（0〜1 の間で揺らす）
        lf.frequency.value = 38; lg.gain.value = 0.5; lf.connect(lg); lg.connect(trem.gain); lf.start(t); lf.stop(t + impactT + 0.1);
        o.connect(lp); lp.connect(trem); trem.connect(g); loopNoise('bandpass', 1500, 3200, 1.5).connect(ramp(0.005, 0.05));
      } else if (kind === 'rumble') {
        loopNoise('lowpass', 70, 220, 0.7).connect(ramp(0.04, 0.5));
        loopNoise('bandpass', 400, 1200, 0.6).connect(ramp(0.0, 0.1));
      } else if (kind === 'wind') {
        loopNoise('bandpass', 280, 900, 0.7).connect(ramp(0.03, 0.2));
        const o = osc('sine', 90, 140); o.connect(ramp(0.0, 0.07));
      } else if (kind === 'water') {
        const lf = ac.createOscillator(), lg = ac.createGain(), g = ramp(0.04, 0.17);
        lf.frequency.value = 0.8; lg.gain.value = 0.12; lf.connect(lg); lg.connect(g.gain); lf.start(t); lf.stop(t + impactT + 0.1);
        loopNoise('bandpass', 500, 1400, 0.5).connect(g);
        loopNoise('lowpass', 80, 160, 0.6).connect(ramp(0.0, 0.18));
      } else {   // space
        osc('sine', 180, 3200).connect(ramp(0.0, 0.045));
        loopNoise('highpass', 800, 6000, 0.5).connect(ramp(0.0, 0.06));
      }
    },
    cineCut() { cutBus(); },
    // 直撃。flash が白なら閃光の音（鋭く高い破裂＋轟き）、黒なら鈍い衝撃だけ。このあとの 0.5 秒は無音にする
    impact(flash) {
      if (!ac) return;
      cutBus();
      const t = now();
      if (flash && flash !== '#ffffff') {
        tone(80, t, 0.5, { type: 'sine', gain: 0.4, f2: 30 });
        noise(t, 0.5, { type: 'lowpass', f: 300, f2: 50, q: 0.7, gain: 0.35 });
        return;
      }
      noise(t, 0.35, { type: 'highpass', f: 1800, q: 0.5, gain: 0.32 });
      noise(t, 1.6, { type: 'lowpass', f: 220, f2: 40, q: 0.7, gain: 0.42 });
      tone(70, t, 0.9, { type: 'sine', gain: 0.24, f2: 28 });
    },
    // 針が境目を越えるカチッ。speed が遅いほど重く強く、死のマスに入る音は高い
    tick(intoDeath, slow) {
      if (!ac) return;
      const t = now();
      const f = intoDeath ? 2300 : 1500;
      tone(f, t, 0.05, { type: 'square', gain: slow ? 0.16 : 0.07, f2: f * 0.7 });
      if (slow) noise(t, 0.04, { f: 3000, q: 2, gain: 0.08 });
    },
    start() { if (ac) noise(now(), 0.5, { f: 400, f2: 2200, q: 1.2, gain: 0.12 }); },
    // 無事：明るい2音
    safe() {
      if (!ac) return;
      const t = now();
      tone(784, t, 0.18, { type: 'triangle', gain: 0.22 });
      tone(1175, t + 0.12, 0.3, { type: 'triangle', gain: 0.22 });
    },
    // かすめて無事：ほっとする息
    relief() { if (ac) noise(now(), 0.35, { f: 1200, f2: 500, q: 0.7, gain: 0.1 }); },
    // 死亡：下がる音
    dead() {
      if (!ac) return;
      const t = now();
      tone(520, t, 0.7, { type: 'sawtooth', gain: 0.22, f2: 70 });
      tone(260, t + 0.05, 0.7, { type: 'square', gain: 0.1, f2: 55 });
      noise(t, 0.25, { f: 900, f2: 200, q: 0.8, gain: 0.18 });
    },
    // 死因カードが出る：ブザー
    card() {
      if (!ac) return;
      const t = now();
      tone(190, t, 0.22, { type: 'square', gain: 0.14 });
      tone(190, t + 0.28, 0.22, { type: 'square', gain: 0.14 });
    },
    press() { if (ac) tone(660, now(), 0.06, { type: 'triangle', gain: 0.15 }); },
    // 初めての死に方：ファンファーレ
    fanfare() {
      if (!ac) return;
      const t = now();
      [[523, 0], [659, 0.11], [784, 0.22], [1047, 0.36]].forEach(([f, d]) => tone(f, t + d, 0.28, { type: 'square', gain: 0.07 }));
      [[523, 0.36], [659, 0.36], [784, 0.36]].forEach(([f, d]) => tone(f, t + d, 0.7, { type: 'triangle', gain: 0.085 }));
    },
    // 図鑑コンプリート／隕石が現れる：長いファンファーレ
    grand() {
      if (!ac) return;
      const t = now();
      [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * 0.13, 0.3, { type: 'square', gain: 0.07 }));
      [523, 659, 784, 1047].forEach(f => tone(f, t + 0.95, 1.1, { type: 'triangle', gain: 0.085 }));
    },
  };
})();
// ===== 操作・ループ・結果 =====
let uiPhase = '', cardShown = false, last = 0, cardTimer = 0;

function bindUI() {
  // 「死ぬ」を押す＝死に方がひとつ決まって、その場面がすぐ流れる
  $('goDie').addEventListener('click', () => {
    Snd.init(); Snd.press();
    if (Game.phase === 'ready' && Game.die()) cinePrepare(Game.deathIdx);
  });
  // 「もう一度」＝すぐ次の死に方（ホームに戻って選び直す手間はなし）
  $('retry').addEventListener('click', () => {
    Snd.init(); Snd.press();
    $('result').classList.remove('show');
    cardShown = false; cardTimer = 0;
    cineReset();
    uiPhase = 'ready';
    if (Game.again()) cinePrepare(Game.deathIdx);
  });
  window.addEventListener('resize', resize);
}

function setMsg(text, cls) {
  const m = $('msg');
  m.textContent = text;
  m.className = cls || '';
  m.style.visibility = '';
}

function updateHeader() {
  $('dayNo').textContent = '死亡 ' + deathCount() + '回';
  $('dexBtn').textContent = '図鑑 ' + dexGot() + '/' + dexTotal();
}

// 局面が変わった瞬間の処理
function onPhase(p) {
  uiPhase = p;
  const go = $('goDie');
  if (p === 'ready') {
    updateHeader();
    setMsg(HIDDEN_ON ? '空に ふしぎな 光が 見える…' : 'あなたは 今日、何で 死ぬ？');
    go.classList.remove('hide');
  } else if (p === 'dead') {
    go.classList.add('hide');
    setMsg('');
    if (!cineEnter()) fallbackDead();   // 全画面の場面があればそれで。なければ簡易演出
  }
}

// 簡易演出：寝たひと＋死因の一言 → 少しして死因カード（場面が用意されていない死に方のための予備）
function fallbackDead() {
  setMsg('死因：' + DEATHS[Game.deathIdx].name, 'dead');
  Snd.dead();
  cardTimer = CFG.deathCardDelay;
}

function showCard() {
  cardShown = true;
  const D = DEATHS[Game.deathIdx];
  const r = dexRecord(Game.deathIdx);          // 図鑑に記録（初めてなら NEW）
  $('rNew').style.display = r.isNew ? 'block' : 'none';
  const od = $('rOdds');
  od.className = r.isNew ? 'new' : '';
  if (r.isNew) {
    const odds = D.n > 0 ? '年間 ' + oddsText(D) + 'の 死に方' : '日本では 記録のない 死に方';
    od.innerHTML = '<span class="nb">おめでとうございます！</span><br><span class="nb">' + odds + '</span> <span class="nb">' + starsText(D) + '</span>';
  } else {
    od.textContent = starsText(D) + '  ・  この死に方は ' + r.count + '回目';
  }
  const bn = $('rBanner');
  if (r.complete) { bn.textContent = '図鑑コンプリート！'; bn.style.display = 'block'; }
  else if (r.unlocked) { bn.textContent = 'あと 1枚！ 空に 光が…'; bn.style.display = 'block'; }
  else bn.style.display = 'none';
  $('rGame').style.display = (r.complete || r.unlocked) ? 'none' : '';   // カードが長くなるので断り書きは省く（図鑑の下には常にある）
  if (r.complete || r.unlocked) { Snd.grand(); confetti(r.complete ? 170 : 100, true); }
  else if (r.isNew) { Snd.fanfare(); confetti(45, true); }
  $('rCause').textContent = D.name;
  $('rStatN').textContent = D.stat;
  $('rStatNote').textContent = D.note;
  $('rPrev').innerHTML = '<i>防ぐには</i>' + D.prevent;
  $('rDays').innerHTML = '<span class="nb">' + deathCount() + '回目の</span> <span class="nb">死亡</span>';
  $('rBest').textContent = '図鑑 ' + r.got + '/' + r.total;
  $('msg').style.visibility = 'hidden';
  cv.style.filter = '';
  $('result').classList.add('show');
  Snd.card();
  shareBlob = null; makeShareImage(b => { shareBlob = b; });   // 共有用の画像を先に作っておく（タップの直後に共有できるように）
}

function frame(ts) {
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
  last = ts;
  Game.step(dt);
  if (Game.phase !== uiPhase) onPhase(Game.phase);
  if (cardTimer > 0) { cardTimer -= dt; if (cardTimer <= 0 && !cardShown) showCard(); }
  cineFrame(dt);
  confettiFrame(dt);
  updateHeader();
  render(dt);
  requestAnimationFrame(frame);
}
// ===== 図鑑とご褒美：注意標識のカード・NEW の判子・レア度・紙ふぶき =====
const DEX_KEY = 'death-simulator-dex';
const POP_JP = 124350000;          // 日本の人口（約 1 億 2,435 万人・2023 年）。「○人に 1 人」の計算に使う
let dexData = {};                  // { 死に方の id: 死んだ回数 }

function dexLoad() {
  try { dexData = JSON.parse(localStorage.getItem(DEX_KEY)) || {}; } catch (_) { dexData = {}; }
}
function dexSave() { try { localStorage.setItem(DEX_KEY, JSON.stringify(dexData)); } catch (_) {} }
function deathCount() { return Object.keys(dexData).reduce((s, k) => s + (dexData[k] || 0), 0); }   // これまでに死んだ回数
function dexTotal() { return DEATHS.length; }                          // 13（隠し枠の隕石をふくむ）
function dexGot() { return DEATHS.filter(d => dexData[d.id] > 0).length; }
function dexSync() {               // 図鑑の中身から、円盤に関わる状態を決める
  DEX_HAS = id => dexData[id] > 0;
  HIDDEN_ON = dexRegular() - dexOpen() >= dexRegular();   // 12 種そろったら隕石が円盤に出る
}
function dexInit() {
  dexLoad(); dexSync();
  window.addEventListener('resize', cv3Resize);
  cv3Resize();
  $('dexBtn').addEventListener('click', () => { Snd.init(); Snd.press(); dexShow(); });
  $('dexOpen2').addEventListener('click', () => { Snd.init(); Snd.press(); dexShow(); });
  $('dexClose').addEventListener('click', () => { Snd.press(); dexHide(); });
  $('ddClose').addEventListener('click', () => { Snd.press(); $('dexDetail').classList.remove('show'); });
  $('dexDetail').addEventListener('click', e => { if (e.target === $('dexDetail')) $('dexDetail').classList.remove('show'); });
}

// レア度（★ 1〜5）：年間の死者が少ないほど高い。隠し枠は 5
function starCount(d) {
  if (d.hidden || !(d.n > 0)) return 5;
  return Math.max(1, Math.min(5, Math.round(5 - Math.log10(d.n) * 1.2)));
}
const starsText = d => '★'.repeat(starCount(d)) + '☆'.repeat(5 - starCount(d));

// 「年間 ○人に 1 人」
function oddsText(d) {
  if (!(d.n > 0)) return '記録なし';
  const p = POP_JP / d.n;
  if (p >= 1e8) return '約' + (p / 1e8).toFixed(1).replace(/\.0$/, '') + '億人に 1 人';
  if (p >= 1e4) return '約' + Math.round(p / 1e4) + '万人に 1 人';
  return '約' + Math.round(p) + '人に 1 人';
}

// 死んだことを図鑑に記録する。画面に出すための情報を返す
function dexRecord(idx) {
  const d = DEATHS[idx];
  const regBefore = dexRegular() - dexOpen();
  const prev = dexData[d.id] || 0;
  dexData[d.id] = prev + 1;
  dexSave();
  dexSync();
  const regAfter = dexRegular() - dexOpen();
  return {
    isNew: prev === 0, count: dexData[d.id], got: dexGot(), total: dexTotal(),
    unlocked: regBefore < dexRegular() && regAfter === dexRegular(),     // 今ちょうど 12 種そろった
    complete: dexGot() === dexTotal() && prev === 0,                     // 今ちょうど 13 枚そろった
  };
}

const cv3 = $('cv3'), ctx3 = cv3.getContext('2d');
let conf = [], cv3K = 1;
function cv3Resize() {
  const r = $('stage').getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  cv3.width = Math.round(r.width * d); cv3.height = Math.round(r.height * d);
  cv3K = r.width / CFG.worldW * d;
}
function confetti(n, fromTop) {
  const cols = ['#ffcc00', '#1a1a1a', '#ffffff', '#d9291c', '#4aa3ff'];
  for (let i = 0; i < n; i++) {
    conf.push({
      x: Math.random() * CFG.worldW, y: fromTop ? -5 - Math.random() * 30 : 40 + Math.random() * 20,
      vx: (Math.random() - 0.5) * 30, vy: fromTop ? 10 + Math.random() * 25 : -50 - Math.random() * 60,
      w: 1.2 + Math.random() * 1.8, h: 0.8 + Math.random() * 1.2, a: Math.random() * TAU, va: (Math.random() - 0.5) * 12,
      col: cols[i % cols.length], life: 2.6 + Math.random() * 1.6,
    });
  }
}
function confettiFrame(dt) {
  ctx3.setTransform(1, 0, 0, 1, 0, 0); ctx3.clearRect(0, 0, cv3.width, cv3.height);
  if (!conf.length) return;
  ctx3.setTransform(cv3K, 0, 0, cv3K, 0, 0);
  conf = conf.filter(p => (p.life -= dt) > 0 && p.y < CFG.worldH + 5);
  conf.forEach(p => {
    p.vy += 70 * dt; p.vx *= 0.995; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
    ctx3.save(); ctx3.translate(p.x, p.y); ctx3.rotate(p.a);
    ctx3.globalAlpha = Math.min(1, p.life);
    ctx3.fillStyle = p.col; ctx3.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx3.restore();
  });
}

// 流れ：止まる(0.3秒・色が抜ける) → 全画面の場面に切り替わる → 迫る(ピクトグラムが気づいて慌てる・寄りと揺れ) → 直撃で白く暗転 → 死因カード

  pendT: 0,
  on: false,          // 映像の再生中

};

// 見たことのある映像は飛ばせる（2回目から）
const SEEN_KEY = 'death-simulator-seen';
const seenMem = new Set();
function wasSeen(id) {
  if (seenMem.has(id)) return true;
  try { return (JSON.parse(localStorage.getItem(SEEN_KEY)) || []).indexOf(id) >= 0; } catch (_) { return false; }
}
function markSeen(id) {
  seenMem.add(id);
  try {
    const a = JSON.parse(localStorage.getItem(SEEN_KEY)) || [];
    if (a.indexOf(id) < 0) { a.push(id); localStorage.setItem(SEEN_KEY, JSON.stringify(a)); }
  } catch (_) {}
}

function cineResize() {
  const r = $('stage').getBoundingClientRect();
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv2.width = Math.round(r.width * d); cv2.height = Math.round(r.height * d);
  Cine.k = r.width / CFG.worldW * d;
}

// 死に方が決まったとき、その死に方に場面があるかを決めておく
function cinePrepare(idx) {
  Cine.def = null;
  const def = DEATHS[idx] && DEATHS[idx].cine;
  if (def && Scenes[def.scene]) Cine.def = def;
}

// 死亡が決まった瞬間。全画面の場面で見せられるなら true
function cineEnter() {
  if (!Cine.def) return false;
  Cine.pending = true; Cine.pendT = 0; Cine.holdMain = true;
  cv.style.transition = 'filter .3s'; cv.style.filter = 'grayscale(1) brightness(.8)';
  $('msg').style.visibility = 'hidden';
  return true;
}

function cineBegin() {
  Cine.pending = false; Cine.on = true; Cine.t = 0; Cine.impacted = false; Cine.afterT = 0;
  cineResize();

  cineEl.classList.remove('out'); cineEl.classList.add('show');

function cineImpact() {
  Cine.impacted = true; Cine.afterT = 0;
  cineFlash.style.background = Cine.def.flash || '#fff';     // 暗転の色は死に方ごと（白＝雷・雪・隕石／黒＝ほか）
  cineFlash.style.opacity = '1';
  ctx2.setTransform(1, 0, 0, 1, 0, 0); ctx2.clearRect(0, 0, cv2.width, cv2.height);   // 当たった瞬間、ピクトグラムは見せない
  Snd.impact(Cine.def.flash);
  markSeen(Cine.def.id || DEATHS[Game.deathIdx].id);
}

// タップで飛ばす（2回目から）。直撃の直前までスキップ
function cineSkip() {
  if (!Cine.on || Cine.impacted) return;
  if (!wasSeen(DEATHS[Game.deathIdx].id)) return;
  Cine.t = Cine.def.impactT;
  Snd.cineCut();
}

function cineEnd() {
  Cine.on = false; Cine.holdMain = false;
  cineEl.classList.add('out');
  setTimeout(() => { if (!Cine.on) cineEl.classList.remove('show', 'out'); }, 450);
  cv.style.transition = ''; cv.style.filter = '';
  cineInner.style.transform = '';
  showCard();
}

function cineReset() {
  Cine.def = null; Cine.pending = false; Cine.on = false; Cine.holdMain = false; Cine.impacted = false;
  cineEl.classList.remove('show', 'out');
  cineFlash.style.opacity = '0';
  cineInner.style.transform = '';
  cv.style.transition = ''; cv.style.filter = '';
  Snd.cineCut();
}

function cineFrame(dt) {
  if (Cine.pending) {
    Cine.pendT += dt;
    if (Cine.pendT >= 0.3) cineBegin();
    return;
  }
  if (!Cine.on) return;
  const D = Cine.def;
  if (!Cine.impacted) {
    Cine.t += dt;
    const p = Math.min(1, Cine.t / D.impactT);
    // 寄り：だんだん速く。揺れ：後半から強く
    const zoom = 1 + 0.42 * p * p;
    const amp = Math.max(0, (p - 0.4) / 0.6);
    const W = cv2.getBoundingClientRect().width || 360;
    const dx = (Math.random() - 0.5) * 2 * W * 0.014 * amp * amp;
    const dy = (Math.random() - 0.5) * 2 * W * 0.014 * amp * amp;
    cineInner.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + zoom.toFixed(4) + ')';
    // ピクトグラム：のんびり立つ → 気づく → 慌てる
    const pose = Cine.t < 0.7 ? 'stand' : (Cine.t < 1.4 ? 'startle' : 'panic');
    const tp = pose === 'stand' ? Cine.t : (pose === 'startle' ? Cine.t - 0.7 : Cine.t - 1.4);
    ctx2.setTransform(Cine.k, 0, 0, Cine.k, 0, 0);
    Scenes[D.scene](ctx2, Math.min(Cine.t, D.impactT), p);   // 背景（全面を塗る）
    const saved = ctx; ctx = ctx2;
    ctx.save();
    ctx.translate(D.feet[0], D.feet[1]); ctx.scale(D.scale, D.scale);
    drawPerson(0, 0, pose, tp);
    ctx.restore();
    ctx = saved;
    if (Cine.t >= D.impactT) cineImpact();
  } else {
    Cine.afterT += dt;
    if (Cine.afterT >= 0.55) cineEnd();      // 白のまま一拍おいて、死因カードへ
  }
}

cineEl.addEventListener('pointerdown', e => { e.preventDefault(); cineSkip(); });
window.addEventListener('resize', () => { if (Cine.on) cineResize(); });
// ===== 起動 =====
dexInit();
shareInit();
Game.reset();
resize();
bindUI();
onPhase('ready');
requestAnimationFrame(frame);
</script>
</body>
</html>
