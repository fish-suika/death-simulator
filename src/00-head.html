<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>死亡シミュレーター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2a2a;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#1a1a1a;
  user-select:none;-webkit-user-select:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
.nb{display:inline-block;white-space:nowrap}

/* 絵は画面いっぱい。遊ぶ場所は縦9:16で中央 */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠。単位は cqw（枠の幅の1%）。文字の置き場所に使う */
#stage{position:relative;container-type:size;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}
.hz{background:repeating-linear-gradient(-45deg,#ffcc00 0 3cqw,#1a1a1a 3cqw 6cqw)}

#stripeT,#stripeB{position:absolute;left:0;right:0;height:3cqw}
#stripeT{top:0}#stripeB{bottom:0}
#hdr{position:absolute;top:5.5cqw;left:5cqw;right:5cqw;height:11cqw;background:#1a1a1a;color:#ffcc00;
  border-radius:1.8cqw;display:flex;align-items:center;justify-content:space-between;padding:0 4cqw}
#dayNo{font-size:7.4cqw;font-weight:bold;letter-spacing:.3cqw}
#best{font-size:3.6cqw;opacity:.9}
#msg{position:absolute;top:49cqw;left:6cqw;right:6cqw;height:11cqw;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:4.6cqw;font-weight:bold}
#msg.dead{color:#fff;background:#1a1a1a;border-radius:1.6cqw;padding:0 3cqw}

.btn{border:0;font:inherit;font-weight:bold;cursor:pointer;touch-action:manipulation;pointer-events:auto}
/* 行き先ボタン（押す＝その日の円盤がまわる） */
#dests{position:absolute;top:147cqw;left:6cqw;right:6cqw;height:18cqw;display:flex;gap:3.5cqw}
#dests.hide{visibility:hidden}
.dest{flex:1;font-size:10cqw;line-height:1;background:#ffcc00;color:#1a1a1a;border:1cqw solid #1a1a1a;border-radius:3.2cqw;
  box-shadow:0 1.4cqw 0 #1a1a1a;padding:0}
.dest:active{transform:translateY(1cqw);box-shadow:0 .4cqw 0 #1a1a1a}
.dest.cur{background:#fff3b0}

/* 死亡演出：全画面の映像（動画の上のキャンバスにピクトグラム。寄り・揺れは #cineInner をまとめて動かす） */
#cine{position:absolute;inset:0;z-index:20;overflow:hidden;background:#000;display:none;pointer-events:auto}
#cine.show{display:block;animation:cfade .3s both}
#cine.out{animation:cout .4s both}
@keyframes cfade{from{opacity:0}to{opacity:1}}
@keyframes cout{from{opacity:1}to{opacity:0}}
#cineInner{position:absolute;inset:0;transform-origin:50% 78%;will-change:transform}
#cv2{position:absolute;inset:0;width:100%;height:100%}
#cineFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* 死因カード：注意標識 */
#result{position:absolute;left:7cqw;right:7cqw;top:50cqw;z-index:30;
  background:#ffcc00;border:1.4cqw solid #1a1a1a;border-radius:3cqw;overflow:hidden;
  box-shadow:0 2cqw 0 #1a1a1a;text-align:center;pointer-events:auto;
  display:none;flex-direction:column;align-items:center;gap:2cqw;padding:0 5cqw 4cqw}
#result.show{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#result .sign{align-self:stretch;margin:0 -5cqw;background:#1a1a1a;color:#ffcc00;font-size:7cqw;font-weight:bold;letter-spacing:2cqw;padding:2cqw 0 2cqw 2cqw}
#rCause{font-size:6.4cqw;font-weight:bold;margin-top:1.6cqw;line-height:1.35}
#rDays{font-size:4.6cqw;font-weight:bold}
#rStat{align-self:stretch;background:#1a1a1a;color:#ffcc00;border-radius:2cqw;padding:2cqw 3cqw;display:flex;flex-direction:column;gap:.8cqw}
#rStat b{font-size:6.6cqw}
#rStat span{font-size:3.1cqw;color:#fff;opacity:.9;line-height:1.4}
#rPrev{font-size:3.7cqw;font-weight:bold;line-height:1.5}
#rPrev i{font-style:normal;background:#1a1a1a;color:#ffcc00;border-radius:1cqw;padding:.3cqw 1.4cqw;margin-right:1.2cqw;font-size:3.2cqw}
#rBest{font-size:3.4cqw;min-height:4cqw}
#rGame{font-size:2.6cqw;opacity:.75}
#rRow{display:flex;gap:2.5cqw;align-self:stretch;margin-top:.5cqw}
#retry{flex:1;height:12.5cqw;font-size:5.4cqw;background:#1a1a1a;color:#ffcc00;border-radius:3cqw}
#retry:active{transform:translateY(.8cqw)}
#dexOpen2{width:24cqw;height:12.5cqw;font-size:4.6cqw;background:#fff3b0;color:#1a1a1a;border:.9cqw solid #1a1a1a;border-radius:3cqw}
#rOdds{font-size:3.7cqw;font-weight:bold;line-height:1.5}
#rOdds.new{color:#1a1a1a;background:#fff;border-radius:1.6cqw;padding:1.2cqw 2.4cqw;border:.6cqw solid #1a1a1a}
#rNew{position:absolute;top:1.4cqw;right:3cqw;display:none;transform:rotate(10deg);border:.8cqw solid #d9291c;color:#d9291c;
  font-size:5cqw;font-weight:bold;padding:.2cqw 2cqw;border-radius:1.4cqw;background:#fffbe0;letter-spacing:.3cqw;animation:stamp .35s cubic-bezier(.3,1.8,.5,1) both}
@keyframes stamp{from{transform:rotate(12deg) scale(2.4);opacity:0}to{transform:rotate(12deg) scale(1);opacity:1}}
#rBanner{display:none;align-self:stretch;background:#d9291c;color:#fff;font-size:4.6cqw;font-weight:bold;padding:1cqw 0;margin:0 -5cqw;letter-spacing:.3cqw;white-space:nowrap}

/* 図鑑：注意標識のカードが並ぶ */
#hdr{gap:2cqw}
#best{flex:1;text-align:right}
#dexBtn{height:7.4cqw;padding:0 2.6cqw;font-size:3.4cqw;background:#ffcc00;color:#1a1a1a;border-radius:2cqw;white-space:nowrap}
#dex{position:absolute;inset:0;z-index:50;background:#fbf8ee;display:none;flex-direction:column;pointer-events:auto}
#dex.show{display:flex;animation:cfade .2s both}
#dexHead{display:flex;align-items:center;justify-content:space-between;margin:5.5cqw 5cqw 2cqw;padding:0 4cqw;height:11cqw;background:#1a1a1a;color:#ffcc00;border-radius:1.8cqw;font-weight:bold}
#dexHead b{font-size:6.4cqw}
#dexClose{height:7.4cqw;padding:0 3cqw;font-size:3.8cqw;background:#ffcc00;color:#1a1a1a;border-radius:2cqw}
#dexGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw 2cqw;padding:2cqw 5cqw;align-content:start;touch-action:pan-y}
.dcard{display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation}
.dsign{position:relative;width:78%;aspect-ratio:1}
.dsign::before{content:'';position:absolute;inset:10%;background:#ffcc00;border:.9cqw solid #1a1a1a;border-radius:2.2cqw;transform:rotate(45deg)}
.dsign canvas{position:absolute;left:25%;top:25%;width:50%;height:50%}
.dcard.empty .dsign::before{background:#d8d4c4;border-color:#8a8678}
.dcard.empty .dsign canvas{display:none}
.dcard.empty .dsign::after{content:'？';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9cqw;font-weight:bold;color:#8a8678}
.dname{font-size:2.9cqw;font-weight:bold;text-align:center;line-height:1.3;margin-top:-1cqw;min-height:7.6cqw}
.dstars{font-size:2.8cqw;color:#b98a00;letter-spacing:-.1cqw;margin-top:.2cqw}
#dexFoot{font-size:2.8cqw;text-align:center;opacity:.75;padding:1.5cqw 4cqw 4.5cqw}
#dexDetail{position:absolute;inset:0;z-index:55;background:#000a;display:none;align-items:center;justify-content:center;pointer-events:auto}
#dexDetail.show{display:flex}
#ddBox{width:86%;background:#ffcc00;border:1.4cqw solid #1a1a1a;border-radius:3cqw;padding:4cqw;display:flex;flex-direction:column;align-items:center;gap:2cqw;text-align:center;box-shadow:0 2cqw 0 #1a1a1a}
#ddIcon{width:24cqw;height:24cqw;background:#fff3b0;border:.9cqw solid #1a1a1a;border-radius:3cqw}
#ddName{font-size:6cqw;font-weight:bold;line-height:1.35}
#ddMeta{font-size:3.6cqw;font-weight:bold}
#ddClose{width:100%;height:11cqw;font-size:4.8cqw;background:#1a1a1a;color:#ffcc00;border-radius:3cqw;margin-top:1cqw}
#cv3{position:absolute;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="stripeT" class="hz"></div>
  <div id="hdr"><span id="dayNo">1日目</span><span id="best"></span><button id="dexBtn" class="btn">図鑑 0/13</button></div>
  <div id="msg"></div>
  <div id="dests">
    <button class="btn dest" data-d="home">家</button>
    <button class="btn dest" data-d="mountain">山</button>
    <button class="btn dest" data-d="sea">海</button>
  </div>
  <div id="cine">
    <div id="cineInner"><canvas id="cv2"></canvas></div>
    <div id="cineFlash"></div>
  </div>
  <div id="result">
    <div class="sign">死亡</div>
    <div id="rBanner"></div>
    <div id="rNew">NEW!</div>
    <div id="rCause"></div>
    <div id="rDays"></div>
    <div id="rOdds"></div>
    <div id="rStat"><b id="rStatN"></b><span id="rStatNote"></span></div>
    <div id="rPrev"></div>
    <div id="rBest"></div>
    <div id="rRow"><button id="retry" class="btn">もう一度</button><button id="dexOpen2" class="btn">図鑑</button></div>
    <div id="rGame">※ ゲームでは 死ぬ頻度を 大げさに しています</div>
  </div>
  <div id="dex">
    <div id="dexHead"><b id="dexTitle">図鑑</b><button id="dexClose" class="btn">とじる</button></div>
    <div id="dexGrid"></div>
    <div id="dexFoot">※ ゲームでは 死ぬ頻度を 大げさに しています</div>
  </div>
  <div id="dexDetail"><div id="ddBox">
    <canvas id="ddIcon" width="160" height="160"></canvas>
    <div id="ddName"></div><div id="ddMeta"></div>
    <div style="align-self:stretch;background:#1a1a1a;color:#ffcc00;border-radius:2cqw;padding:2cqw 3cqw;display:flex;flex-direction:column;gap:.8cqw"><b id="ddStat" style="font-size:6.2cqw"></b><span id="ddNote" style="font-size:3.1cqw;color:#fff;line-height:1.4"></span></div>
    <div id="ddPrev" style="font-size:3.5cqw;font-weight:bold;line-height:1.5"></div>
    <button id="ddClose" class="btn">とじる</button>
  </div></div>
  <canvas id="cv3"></canvas>
  <div id="stripeB" class="hz"></div>
</div>
<script>
