<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>死亡シミュレーター 検証</title>
<style>body{font:16px sans-serif;padding:16px}.ok{color:#080}.ng{color:#c00;font-weight:bold}pre{background:#f4f4f4;padding:8px}</style>
</head><body><h1>死亡シミュレーター 検証</h1><div id="out"></div>
<script>
// ===== 調整用の数値（ここだけ触れば遊びが変わる）=====
// 世界の大きさは 幅100 × 高さ177.8（縦9:16）。長さの単位はすべてこの世界の単位
const CFG = {
  worldW: 100,
  worldH: 100 * 16 / 9,
  shareUrl: 'https://fish-suika.github.io/death-simulator/',

  // 図鑑のおまけ：まだ載っていない死に方が出やすくなる（図鑑の最後が埋まらないのを防ぐ。目安：通しで 20〜25 回で 12 種そろう）
  boostFrom: 3,         // 図鑑に載っている数がこれを超えたら太くなり始める
  boostMax: 5,          // 12 種のうち最後の 1 つが載っていないとき、重みが 1+この値 倍
  minWeight: 0.9,       // 重みの下限（まれな死に方も細くなりすぎないように）
};

// 死に方（実データ。出典と計算は docs/データ出典.md）。
// n：年間の死者数（円盤のマス幅の元。weight = 1 + log10(n) で縮める）。stat/note：死因カードに出す数字と出どころ。prevent：防ぐには。
// dest：出る行き先（any は どの行き先でも出る）。cine：全画面の場面（無い物は簡易演出）
const DEATHS = [
  { id: 'mochi', dest: 'home', name: 'もちを のどに つまらせる', n: 330,
    stat: '年間 約330人', note: '65歳以上・2018〜2019年の平均（消費者庁）',
    prevent: 'もちは 小さく切って、よくかんでから 飲みこむ',
    near: 'もちが のどの おくを かすめた',
    cine: { scene: 'mochi', impactT: 3.2, flash: '#000000', feet: [50, 152], scale: 1.25, sound: 'room' } },
  { id: 'yuki', dest: 'home', name: '雪下ろしで 屋根から 落ちる', n: 80,
    stat: '年間 約80人', note: '雪害の死者・2010〜2019年冬の平均。大半が除雪中（消防庁）',
    prevent: '雪下ろしは ひとりでやらず、命綱と ヘルメットを つける',
    near: '屋根の雪が ずるっと 動いた',
    cine: { scene: 'yuki', impactT: 3, flash: '#ffffff', feet: [50, 152], scale: 1.3, sound: 'rumble' } },
  { id: 'fugu', dest: 'home', name: 'フグの毒に あたる', n: 1.5,
    stat: '10年で 約15人', note: '2003〜2012年（神奈川県衛生研究所の集計）',
    prevent: 'フグは 免許のある店で。釣ったフグを 家でさばかない',
    near: 'フグの 肝が ちらっと 見えた',
    cine: { scene: 'fugu', impactT: 3, flash: '#000000', feet: [50, 152], scale: 1.25, sound: 'room' } },
  { id: 'kinoko', dest: 'home', name: '毒キノコを 食べる', n: 0.3,
    stat: '10年で 3人', note: '2012〜2021年（厚生労働省）',
    prevent: '知らない キノコは 食べない・人にも あげない。迷ったら 捨てる',
    near: 'あやしい キノコと めが あった',
    cine: { scene: 'kinoko', impactT: 3.2, flash: '#000000', feet: [50, 152], scale: 1.25, sound: 'room' } },
  { id: 'furo', dest: 'home', name: 'お風呂で おぼれる', n: 5000,
    stat: '年間 約5,000人', note: '家庭の浴槽・2015〜2019年（人口動態統計）。交通事故より多い',
    prevent: 'お湯は 41度以下・10分まで。入る前に 脱衣所と 浴室を あたためる。家族に ひと声かける',
    near: 'お湯が ちょっと 熱かった',
    cine: { scene: 'furo', impactT: 3.2, flash: '#000000', feet: [50, 150], scale: 1.25, sound: 'room' } },
  { id: 'hachi', dest: 'mountain', name: 'ハチに さされる', n: 18,
    stat: '年間 約18人', note: '2021〜2024年の平均（人口動態統計）',
    prevent: '黒い服を 避け、巣を見つけたら そっと はなれる。さされたら すぐ病院へ',
    near: 'ハチが みみもとを とおりすぎた',
    cine: { scene: 'hachi', impactT: 3.2, flash: '#000000', feet: [50, 150], scale: 1.3, sound: 'buzz' } },
  { id: 'hebi', dest: 'mountain', name: '毒ヘビに かまれる', n: 3.5,
    stat: '年間 約3〜4人', note: '2018〜2019年（人口動態統計）',
    prevent: '草むらに 手や足を つっこまない。かまれたら 動かず 救急車を',
    near: '足もとの 落ち葉が がさっと 動いた',
    cine: { scene: 'hebi', impactT: 3, flash: '#000000', feet: [30, 152], scale: 1.3, sound: 'room' } },
  { id: 'nadare', dest: 'mountain', name: '雪崩に のまれる', n: 9,
    stat: '年間 約9人', note: '1991〜2020年の30年で274人（日本雪崩ネットワーク）',
    prevent: '雪崩の危険が高い日は 斜面に入らない。入るなら 装備と講習を',
    near: '山の上で 雪けむりが 上がった',
    cine: { scene: 'nadare', impactT: 3.2, flash: '#ffffff', feet: [50, 150], scale: 1.3, sound: 'rumble' } },
  { id: 'sangaku', dest: 'mountain', name: '山で 遭難する', n: 300,
    stat: '年間 約300人', note: '死者・行方不明者・2024年（警察庁）。原因は道迷い・転倒・滑落など',
    prevent: '登山計画書を出し、ヘッドライトと 防寒着を持つ。道に迷ったら 沢には おりない',
    near: '道が 二つに 分かれていた',
    cine: { scene: 'sangaku', impactT: 3.4, flash: '#000000', feet: [50, 152], scale: 1.3, sound: 'wind' } },
  { id: 'tsuri', dest: 'sea', name: '釣りで 海に 落ちる', n: 90,
    stat: '年間 約90人', note: '釣り中の海中転落・2004〜2013年の平均（海上保安庁）',
    prevent: 'ライフジャケットを着る。ひとりで行かず、荒れた日の 岩場や防波堤には 行かない',
    near: '足もとの 岩が ぬるっと した',
    cine: { scene: 'tsuri', impactT: 3.2, flash: '#000000', feet: [38, 152], scale: 1.3, sound: 'water' } },
  { id: 'umi', dest: 'sea', name: '海で おぼれる', n: 372,
    stat: '年間 約370人', note: '海の死者・行方不明者・2024年（警察庁）',
    prevent: '流されたら 岸と平行に およぐ。ライフジャケットを着て、監視員のいる浜で',
    near: 'あしが ふっと うきそうになった',
    cine: { scene: 'umi', impactT: 3.2, flash: '#000000', feet: [50, 150], scale: 1.3, sound: 'water' } },
  { id: 'rakurai', dest: 'any', name: '落雷に うたれる', n: 10,
    stat: '年間 10人未満', note: '近年の日本（藤部 2017）',
    prevent: '空が 暗くなったら 建物か 車の中へ。木の下には にげない',
    near: 'とおくで ゴロゴロと なった',
    // 全画面の場面（背景は 45-scenes.js がコードで描く）。impactT：この秒で直撃（白く暗転）。feet：ピクトグラムの足もと（世界の座標）。scale：大きさ
    cine: { scene: 'rakurai', impactT: 3.3, flash: '#ffffff', feet: [50, 152], scale: 1.3, sound: 'storm' } },
  // 隠し枠：図鑑が 12 種そろったときだけ円盤に出る。日本での死亡の記録が見つからない（数字は「記録 0 人」）
  { id: 'inseki', dest: 'any', hidden: true, name: '隕石に あたる', n: 0,
    stat: '記録 0人', note: '日本で死亡した記録は 見つからない（調べた範囲）',
    prevent: '心配は いらない。それより お風呂に 気をつけて',
    near: '空に 光る点が ひとつ 見えた',
    cine: { scene: 'inseki', impactT: 3.6, flash: '#ffffff', feet: [50, 152], scale: 1.3, sound: 'space' } },
];
DEATHS.forEach(d => { d.weight = d.hidden ? CFG.minWeight : Math.max(CFG.minWeight, 1 + Math.log10(d.n)); });

// 映像の試しプレイ用（rakurai-test.html だけで有効）。落雷だけが出る
if (typeof TEST_RAKURAI !== 'undefined' && TEST_RAKURAI) {
  DEATHS.forEach(d => { d.weight = d.id === 'rakurai' ? 10 : 0.0001; });

}

// 無事の日の一言
const SAFE_LINES = ['ふつうの 一日だった', 'なにも 起きなかった', 'ぶじに 夜をむかえた', 'いい 天気だった', 'ごはんが おいしかった'];
const CLOSE_LINES = ['あぶなかった…', 'いま なにか すれちがった', '心臓が ドキッとした'];
// ===== ゲームの中身（画面を使わない。verify.html でもそのまま動く）=====
// ルーレットと行き先選びはやめた（テストプレイで「毎回選ぶのが面倒」と言われたため）。
// タップすると、実データの比にそった重みで死に方がひとつ決まり、すぐその場面が流れる
const TAU = Math.PI * 2;
const mod = (a, m) => ((a % m) + m) % m;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 図鑑まわり（画面側 65-dex.js が差し替える）。隠し枠（隕石）は、図鑑が 12 種そろうと出る
let HIDDEN_ON = false;
let DEX_HAS = () => false;                       // その死に方が図鑑に載っているか
const dexOpen = () => DEATHS.filter(d => !d.hidden && !DEX_HAS(d.id)).length;   // 図鑑の空き
const dexRegular = () => DEATHS.filter(d => !d.hidden).length;                  // 隠し枠をのぞく種類数

// 死に方の重み。図鑑にまだ載っていない死に方は、載っている数が増えるほど太くなる（最大 1+CFG.boostMax 倍）。
// まれな死に方ほど出ないので、そのままだと図鑑の最後が埋まらなくなるのを防ぐ（設定資料 5.10）
function wheelWeight(i) {
  const d = DEATHS[i];
  if (d.hidden || DEX_HAS(d.id)) return d.weight;
  const got = dexRegular() - dexOpen();
  return d.weight * (1 + CFG.boostMax * Math.max(0, Math.min(1, (got - CFG.boostFrom) / (dexRegular() - 1 - CFG.boostFrom))));
}

// 出る可能性のある死に方（番号）。隠し枠は図鑑がそろうまで出ない
function candidates() {
  const out = [];
  DEATHS.forEach((d, i) => { if (!d.hidden || HIDDEN_ON) out.push(i); });
  return out;
}

// 死に方をひとつ決める
function pickDeath(rng) {
  const list = candidates();
  const total = list.reduce((s, i) => s + wheelWeight(i), 0);
  let r = rng() * total;
  for (const i of list) { r -= wheelWeight(i); if (r < 0) return i; }
  return list[list.length - 1];
}

const Game = {
  reset(seed) {
    this.rng = mulberry32(seed == null ? (Math.random() * 2147483647) | 0 : seed);
    this.phase = 'ready';      // ready → dead（もう一度は ready に戻して die）
    this.deathIdx = -1;
    this.tPhase = 0;
  },
  // 死ぬ（死に方が決まる）
  die() {
    if (this.phase !== 'ready') return false;
    this.deathIdx = pickDeath(this.rng);
    this.phase = 'dead';
    this.tPhase = 0;
    return true;
  },
  // もう一度（すぐ次の死に方）
  again() {
    this.phase = 'ready';
    return this.die();
  },
  step(dt) { this.tPhase += dt; },
};
// ===== 自動テスト =====
(function () {
  const out = document.getElementById('out');
  let fail = 0;
  function check(name, cond, note) {
    if (!cond) fail++;
    const p = document.createElement('div');
    p.className = cond ? 'ok' : 'ng';
    p.textContent = (cond ? 'OK  ' : 'NG  ') + name + (note ? '  [' + note + ']' : '');
    out.appendChild(p);
  }
  const reg = DEATHS.map((d, i) => i).filter(i => !DEATHS[i].hidden);

  // --- データ ---
  {
    const miss = DEATHS.filter(d => !((d.n > 0 || d.hidden) && d.stat && d.note && d.prevent && d.name && d.cine && d.cine.scene && d.cine.impactT > 0)).map(d => d.id);
    check('死に方 13 種（隠し枠をふくむ）に、数字・出どころ・防ぐには・名前・場面の設定がそろっている', DEATHS.length === 13 && dexRegular() === 12 && miss.length === 0, miss.join(','));
    check('重みは下限以上で、数字が大きい死に方ほど重い', DEATHS.every(d => d.weight >= CFG.minWeight - 1e-9) && DEATHS.find(d => d.id === 'furo').weight > DEATHS.find(d => d.id === 'mochi').weight && DEATHS.find(d => d.id === 'mochi').weight > DEATHS.find(d => d.id === 'kinoko').weight);
  }

  // --- 死に方の決まり方 ---
  {
    // 図鑑が空のとき、出る割合は重みの比どおり
    DEX_HAS = () => false; HIDDEN_ON = false;
    const rng = mulberry32(12345), N = 120000, cnt = DEATHS.map(() => 0);
    for (let i = 0; i < N; i++) cnt[pickDeath(rng)]++;
    const total = reg.reduce((s, i) => s + wheelWeight(i), 0);
    const worst = Math.max(...reg.map(i => Math.abs(cnt[i] / N - wheelWeight(i) / total)));
    check('死に方の出る割合が、重みの比どおり（12 万回）', worst < 0.006, '最大のずれ ' + (worst * 100).toFixed(2) + ' ポイント');
    check('隠し枠（隕石）は、図鑑がそろうまで一度も出ない', cnt[DEATHS.findIndex(d => d.hidden)] === 0);
    check('12 種ぜんぶが出る', reg.every(i => cnt[i] > 0));
  }
  {
    // 隕石：12 種そろったら出る。重みの比どおり
    DEX_HAS = () => true; HIDDEN_ON = true;
    const hid = DEATHS.findIndex(d => d.hidden), rng = mulberry32(777), N = 60000; let c = 0;
    for (let i = 0; i < N; i++) if (pickDeath(rng) === hid) c++;
    const total = candidates().reduce((s, i) => s + wheelWeight(i), 0), exp = wheelWeight(hid) / total;
    check('隕石は 12 種そろうと出るようになる（重みの比どおり）', c > 0 && Math.abs(c / N - exp) < 0.006, (c / N * 100).toFixed(2) + '% / 期待 ' + (exp * 100).toFixed(2) + '%');
    DEX_HAS = () => false; HIDDEN_ON = false;
  }
  {
    // 図鑑の空きが少ないと、まだ載っていない死に方が出やすくなる（最大 1+boostMax 倍）。載っている物は変わらない
    const ids = reg.map(i => DEATHS[i].id);
    DEX_HAS = () => false; const none = wheelWeight(reg[0]) === DEATHS[reg[0]].weight;
    DEX_HAS = id => ids.indexOf(id) < CFG.boostFrom; const few = wheelWeight(reg[11]) === DEATHS[reg[11]].weight;     // 数が少ないうちは変わらない
    DEX_HAS = id => ids.indexOf(id) < 11;
    const last = reg[11], max = wheelWeight(last) / DEATHS[last].weight;
    const owned = wheelWeight(reg[0]) === DEATHS[reg[0]].weight;
    DEX_HAS = () => false;
    check('図鑑の空きが少ないと、まだ載っていない死に方が最大 ' + (1 + CFG.boostMax) + ' 倍出やすくなる', none && few && owned && Math.abs(max - (1 + CFG.boostMax)) < 1e-9, '最後の 1 つは ' + max.toFixed(2) + ' 倍');
  }
  {
    // 12 種そろうまでの回数（目安：20〜25 回）
    let sum = 0, mx = 0; const N = 3000;
    for (let k = 0; k < N; k++) {
      const seen = new Set(), rng = mulberry32(k + 1);
      DEX_HAS = id => seen.has(id); HIDDEN_ON = false;
      let n = 0;
      while (n < 3000) { n++; seen.add(DEATHS[pickDeath(rng)].id); if (dexOpen() === 0) break; }
      sum += n; mx = Math.max(mx, n);
    }
    DEX_HAS = () => false;
    const mean = sum / N;
    check('12 種そろうまでの回数が平均 15〜30 回', mean >= 15 && mean <= 30, '平均 ' + mean.toFixed(1) + ' 回 / 最長 ' + mx + ' 回');
  }

  // --- 進み方 ---
  {
    Game.reset(5);
    const a = Game.phase === 'ready' && Game.die() && Game.phase === 'dead' && Game.deathIdx >= 0;
    const b = Game.die() === false;                              // 死んでいる間は、もう一度死ねない
    const c = Game.again() && Game.phase === 'dead';
    Game.reset(9); const x = (Game.die(), Game.deathIdx); Game.reset(9); const y = (Game.die(), Game.deathIdx);
    check('死ぬ → もう一度、の流れが正しい', a && b && c);
    check('同じシードなら同じ死に方になる', x === y);
  }

  const s = document.createElement('h2');
  s.textContent = fail === 0 ? '全部OK' : fail + ' 件NG';
  s.className = fail === 0 ? 'ok' : 'ng';
  out.appendChild(s);
  document.title = fail === 0 ? 'ALL OK' : 'FAIL ' + fail;
})();
</script>
